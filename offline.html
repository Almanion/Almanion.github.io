<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Almanion — офлайн</title>
    <link rel="icon" href="favicons/favicon.svg?v=20261123-tech-book" type="image/svg+xml">
    <link rel="icon" media="(prefers-color-scheme: dark)" href="favicons/favicon-dark.svg?v=20261123-tech-book" type="image/svg+xml">
    <script defer src="/offline-library.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #2563eb;
            --border: #e2e8f0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #111827;
                --text: #f8fafc;
                --muted: #94a3b8;
                --border: #243244;
            }
        }

        * { box-sizing: border-box; }

        body {
            align-items: center;
            background:
                radial-gradient(circle at 18% 10%, rgba(37, 99, 235, 0.14), transparent 34rem),
                var(--bg);
            color: var(--text);
            display: flex;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 1.5rem;
        }

        main {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            box-shadow: 0 22px 70px rgba(15, 23, 42, 0.12);
            max-width: 34rem;
            padding: 2rem;
            text-align: center;
        }

        .almanion-wordmark { margin-bottom: 1rem; }

        h1 {
            font-size: clamp(1.45rem, 5vw, 2.1rem);
            line-height: 1.1;
            margin: 0 0 0.75rem;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
            margin: 0 0 1.25rem;
        }

        a, button {
            background: var(--accent);
            border: 0;
            border-radius: 999px;
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            font: inherit;
            font-weight: 700;
            padding: 0.78rem 1.05rem;
            text-decoration: none;
        }
        #offlineSaved { margin: 1.25rem 0; text-align: left; }
        #offlineSaved h2 { font-size: 1rem; }
        #offlineSaved ul { list-style: none; padding: 0; }
        #offlineSaved a {
            display: block;
            padding: .65rem 0;
            color: var(--text);
            background: transparent;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            text-decoration: underline;
            text-underline-offset: .2em;
        }
    </style>
</head>
<body>
    <main>
        <img class="almanion-wordmark" src="images/almanion-wordmark.svg?v=20261123-tech-book" width="142" height="35" alt="Almanion">
        <h1>Сейчас нет соединения</h1>
        <section id="offlineSaved" hidden aria-labelledby="offlineSavedTitle">
            <h2 id="offlineSavedTitle">Скачанные конспекты</h2>
            <ul></ul>
        </section>
        <button type="button" onclick="location.reload()">Попробовать снова</button>
    </main>
</body>
</html>
