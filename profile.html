<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <title>Мой профиль · Almanion</title>
    <script src="theme-bootstrap.js?v=20261123-palettes"></script>
    <script defer src="page-transitions.js?v=20261120-navigation"></script>
    <link rel="icon" href="favicons/favicon.svg?v=20261124-aligned-a" type="image/svg+xml">
    <script defer src="favicon-theme.js?v=20261124-aligned-a"></script>
    <link rel="stylesheet" href="styles/page-transitions.css">
    <link rel="stylesheet" href="styles/site/index.css?v=20261125-profile">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="style-new.css?v=20260929-2">
    <link rel="stylesheet" href="styles/typography.css">
    <link rel="stylesheet" href="styles/profile-covers.css?v=20261126-1">
    <link rel="stylesheet" href="styles/profile.css?v=20261126-2">
</head>
<body class="profile-page" data-no-math>
    <script>window.AlmanionThemeBootstrap.applyBody();</script>
    <header class="profile-topbar sidebar-header">
        <a href="index.html" aria-label="Almanion · На главную"><img class="almanion-wordmark" src="images/almanion-wordmark.svg?v=20261124-aligned-a" width="106" height="22" alt="Almanion"></a>
        <div class="sidebar-header-buttons"></div>
    </header>
    <main class="profile-shell">
        <div class="profile-page-heading">
            <a class="profile-back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg>На главную</a>
            <h1>Мой профиль</h1>
        </div>
        <section class="profile-gate" id="profileGate" aria-live="polite">
            <p id="profileGateMessage">Загружаем профиль…</p>
            <button class="profile-primary" id="profileGateAction" type="button" hidden>Войти</button>
        </section>
        <noscript>Для редактирования профиля включите JavaScript.</noscript>
        <div class="profile-layout" id="profileEditor" hidden>
            <div class="profile-overview">
                <section class="profile-card" id="profileCard" aria-label="Предпросмотр профиля" data-profile-color="iris" data-cover="orbit" tabindex="-1">
                    <div class="profile-cover" id="profileCoverArt" aria-hidden="true"></div>
                    <div class="profile-card-body">
                        <div id="profilePreviewAvatar"></div>
                        <h2 id="profilePreviewName"></h2>
                        <p id="profileEmail"></p>
                        <a class="profile-telegram-preview" id="profilePreviewTelegram" target="_blank" rel="noopener noreferrer" hidden></a>
                    </div>
                </section>
                <section class="profile-verification" id="email" aria-labelledby="emailTitle" hidden>
                    <h2 id="emailTitle">Подтверждение почты</h2>
                    <p id="emailState" role="status"></p>
                    <form id="emailCodeForm" hidden>
                        <label for="emailCode">Код из письма</label>
                        <input id="emailCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
                        <button class="profile-primary" type="submit">Подтвердить</button>
                    </form>
                    <div class="email-code-actions"><button id="emailSend" type="button" class="profile-secondary">Получить код</button><button id="emailHaveCode" type="button">У меня есть код</button></div>
                    <p class="profile-error" id="emailError" role="alert" hidden></p>
                </section>
            </div>
            <form id="profileForm" class="profile-form" novalidate>
                <div class="profile-compact" id="profileCompact" data-profile-color="iris">
                    <div class="profile-compact-cover" id="profileCompactCover" aria-hidden="true"></div>
                    <div id="profileCompactAvatar" aria-hidden="true"></div>
                    <span id="profileCompactName" aria-hidden="true"></span>
                    <button type="button" id="profileShowPreview" class="profile-preview-button" aria-label="Показать профиль" title="Показать профиль">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4m6 0h4a1 1 0 0 1 1 1v4m0 6v4a1 1 0 0 1-1 1h-4m-6 0H5a1 1 0 0 1-1-1v-4"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <fieldset id="profileFields">
                    <legend class="profile-sr">Настройки профиля</legend>
                    <section class="profile-section">
                        <h2>Аватар</h2>
                        <fieldset class="profile-choice-group">
                            <legend>Значок</legend>
                            <div class="profile-icons" id="profileIcons"></div>
                        </fieldset>
                        <div class="profile-field" id="profileMonogramField">
                            <label for="profileMonogram">Инициалы</label>
                            <input id="profileMonogram" name="monogram" maxlength="2" autocomplete="off" spellcheck="false" aria-describedby="monogramError">
                            <p class="profile-error" id="monogramError" hidden></p>
                        </div>
                        <div class="profile-avatar-options">
                            <fieldset class="profile-choice-group">
                                <legend>Палитра <span id="profileColorName"></span></legend>
                                <div class="profile-colors" id="profileColors"></div>
                            </fieldset>
                            <fieldset class="profile-choice-group">
                                <legend>Форма</legend>
                                <div class="profile-shapes" id="profileShapes"></div>
                            </fieldset>
                            <fieldset class="profile-choice-group">
                                <legend>Фон аватара</legend>
                                <div class="profile-backgrounds" id="profileBackgrounds"></div>
                            </fieldset>
                        </div>
                    </section>
                    <section class="profile-section" aria-labelledby="profileCoverTitle">
                        <h2 id="profileCoverTitle">Обложка профиля</h2>
                        <div class="profile-covers" id="profileCovers" role="group" aria-labelledby="profileCoverTitle"></div>
                    </section>
                    <section class="profile-section">
                        <h2>Личные данные</h2>
                        <div class="profile-fields-grid">
                            <div class="profile-field">
                                <label for="profileNickname">Ник</label>
                                <input id="profileNickname" name="nickname" type="text" autocomplete="nickname" maxlength="32" spellcheck="false" aria-describedby="nicknameError">
                                <p class="profile-error" id="nicknameError" hidden></p>
                            </div>
                            <div class="profile-field">
                                <label for="profileTelegram">Telegram</label>
                                <input id="profileTelegram" name="telegram" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="128" placeholder="@username" aria-describedby="telegramHelp telegramError">
                                <p id="telegramHelp" class="profile-hint">Виден только вам. Можно вставить ссылку t.me.</p>
                                <p class="profile-error" id="telegramError" hidden></p>
                            </div>
                        </div>
                    </section>
                    <section class="profile-section">
                        <h2>В прогнозах</h2>
                        <label class="profile-consent"><input name="rankVisible" id="rankVisible" type="checkbox"> Показывать ник и аватар в рейтинге</label>
                        <p class="profile-hint">По умолчанию другим участникам виден игровой псевдоним.</p>
                    </section>
                </fieldset>
                <footer class="profile-actions">
                    <p id="profileStatus" role="status"></p>
                    <div>
                        <button type="button" class="profile-secondary" id="profileReset" hidden>Отменить</button>
                        <button class="profile-primary" id="profileSave" type="submit" disabled>Сохранить</button>
                    </div>
                </footer>
            </form>
        </div>
    </main>
    <script src="data-sync.js"></script>
    <script src="kc-storage.js"></script>
    <script src="settings.js?v=20261009-1"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
    <script defer src="firebase-config.js"></script>
    <script defer src="account.js?v=20261125-profile"></script>
    <script defer src="profile-verification.js"></script>
    <script defer src="profile-covers.js?v=20261126-1"></script>
    <script defer src="profile.js?v=20261126-2"></script>
</body>
</html>
