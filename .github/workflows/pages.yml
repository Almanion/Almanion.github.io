name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase rules tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install build tooling
        run: npm ci --ignore-scripts

      - name: Install browser for interface checks
        run: npx playwright install --with-deps chromium webkit

      - name: Verify Firebase access rules
        run: npm run test:rules

      - name: Test, build, and validate
        run: npm run ci

      - name: Verify native tab navigation
        run: npx playwright test e2e/game-pages.spec.js --grep "Control and middle" --workers 1

      - name: Check desktop and mobile interfaces
        run: npm run test:e2e

      - name: Preserve failed interface diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interface-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve verified site for rollback
        uses: actions/upload-artifact@v7
        with:
          name: site-build-${{ github.sha }}
          path: _site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000

      - name: Checkout verifier
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify the published revision
        run: node tools/verify-production.js --url "${{ steps.deployment.outputs.page_url }}" --revision "${{ github.sha }}"
