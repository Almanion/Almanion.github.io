name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_campaign:
        description: Replay all four full Signal Frontier operations through browser controls
        type: boolean
        default: false

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      signal_only: ${{ steps.scope.outputs.signal_only }}
      campaign: ${{ steps.scope.outputs.campaign }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Select checks from changed files
        id: scope
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_FORCE_CAMPAIGN: ${{ inputs.full_campaign }}
        run: node tools/signal-ci-scope.js

  build:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase rules tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install build tooling
        run: npm ci --ignore-scripts

      - name: Install browser for interface checks
        run: npx playwright install --with-deps chromium webkit

      - name: Verify Firebase access rules
        run: npm run test:rules

      - name: Test, build, and validate
        run: npm run ci

      - name: Verify native tab navigation
        run: npx playwright test e2e/game-pages.spec.js --grep "Control and middle" --workers 1

      - name: Check Signal desktop and mobile interfaces
        if: needs.scope.outputs.signal_only == 'true'
        run: >-
          npx playwright test signal-frontier game-pages --grep-invert "long (siege|infiltration): full operation"

      - name: Check all desktop and mobile interfaces
        if: needs.scope.outputs.signal_only != 'true'
        run: >-
          npx playwright test --grep-invert "long (siege|infiltration): full operation"

      - name: Preserve failed interface diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interface-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve verified site for rollback
        uses: actions/upload-artifact@v7
        with:
          name: site-build-${{ github.sha }}
          path: _site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  campaign:
    needs: scope
    if: needs.scope.outputs.campaign == 'true'
    name: Complete new and legacy Signal Frontier operations
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install build tooling
        run: npm ci --ignore-scripts

      - name: Install browser for complete operations
        run: npx playwright install --with-deps chromium

      - name: Build the same revision for campaign checks
        run: npm run site:build

      - name: Complete siege and infiltration through real controls
        run: >-
          npx playwright test e2e/signal-frontier-campaign.spec.js --grep "long (siege|infiltration): full operation" --workers 2

      - name: Preserve failed campaign diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.scope.result == 'success' && needs.build.result == 'success' &&
      (needs.campaign.result == 'success' ||
       (needs.scope.outputs.campaign == 'false' && needs.campaign.result == 'skipped'))
    needs: [scope, build, campaign]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000

      - name: Checkout verifier
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify the published revision
        run: node tools/verify-production.js --url "${{ steps.deployment.outputs.page_url }}" --revision "${{ github.sha }}"
