<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">Геометрическая интерпретация леммы Эйзенштейна</title>
  <desc id="desc">Для p равно 11 и эл равно 7 показан прямоугольник с диагональю игрек равно эл делить на p умножить на икс. Бирюзовые точки имеют чётную абсциссу и лежат ниже диагонали. Центральная симметрия вокруг точки M связывает области BMT и AML.</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#173f70"/>
    </marker>
    <style>
      .frame{fill:#fbfdff;stroke:#d6e1ed;stroke-width:2}
      .plot-bg{fill:#fff;stroke:#d6e1ed;stroke-width:2}
      .amk{fill:#fff4d9}.aml{fill:#e3f4f1}.bmt{fill:#fff0e8}.lmbc{fill:#edf4fb}
      .grid{stroke:#d9e3ed;stroke-width:1}.half{stroke:#7f99b3;stroke-width:1.7;stroke-dasharray:7 6}
      .axis{stroke:#173f70;stroke-width:2.4;marker-end:url(#axis-arrow)}
      .diagonal{stroke:#173f70;stroke-width:3}.pair{stroke:#d98b76;stroke-width:1.4;stroke-dasharray:5 5;opacity:.72}
      .node{fill:#fff;stroke:#b7c7d8;stroke-width:1.15}.counted{fill:#0b8f87;stroke:#fff;stroke-width:2}
      .paired{fill:#fff;stroke:#d4674c;stroke-width:2.3}.center{fill:#173f70;stroke:#fff;stroke-width:2}
      .heading{font:700 24px system-ui,sans-serif;fill:#173f70}.subheading{font:700 18px system-ui,sans-serif;fill:#173f70}
      .label{font:18px Georgia,serif;fill:#173f70}.small{font:15px system-ui,sans-serif;fill:#536d87}
      .point-label{font:700 17px system-ui,sans-serif;fill:#173f70}.region{font:700 16px system-ui,sans-serif;text-anchor:middle}
      .formula{font:18px Georgia,serif;fill:#173f70}.formula-strong{font:700 18px Georgia,serif;fill:#0a7771}
      .card{fill:#fff;stroke:#d6e1ed;stroke-width:1.5}.result{fill:#e7f4f2;stroke:#b8ddd8;stroke-width:1.5}
      .legend-teal{fill:#0b8f87}.legend-coral{fill:#fff;stroke:#d4674c;stroke-width:2.2}
    </style>
  </defs>

  <rect class="frame" x="18" y="18" width="1124" height="684" rx="18"/>
  <text class="heading" x="50" y="58">Лемма Эйзенштейна как подсчёт узлов решётки</text>
  <text class="small" x="50" y="84">пример: p = 11, ℓ = 7; прямая AB не проходит через целые узлы</text>

  <rect class="plot-bg" x="62" y="102" width="646" height="524" rx="14"/>
  <polygon class="amk" points="90,590 365,380 90,380"/>
  <polygon class="aml" points="90,590 365,380 365,590"/>
  <polygon class="bmt" points="365,380 365,170 640,170"/>
  <polygon class="lmbc" points="365,590 365,380 640,170 640,590"/>

  <g class="grid">
    <path d="M140 170V590M190 170V590M240 170V590M290 170V590M340 170V590M390 170V590M440 170V590M490 170V590M540 170V590M590 170V590"/>
    <path d="M90 530H640M90 470H640M90 410H640M90 350H640M90 290H640M90 230H640"/>
  </g>
  <rect x="90" y="170" width="550" height="420" fill="none" stroke="#9bb0c4" stroke-width="1.5"/>
  <path class="half" d="M365 170V590M90 380H640"/>
  <path class="diagonal" d="M90 590L640 170"/>
  <path class="axis" d="M75 590H686"/><path class="axis" d="M90 608V126"/>

  <g class="node">
    <circle cx="140" cy="530" r="2.8"/><circle cx="140" cy="470" r="2.8"/><circle cx="140" cy="410" r="2.8"/><circle cx="140" cy="350" r="2.8"/><circle cx="140" cy="290" r="2.8"/><circle cx="140" cy="230" r="2.8"/>
    <circle cx="190" cy="530" r="2.8"/><circle cx="190" cy="470" r="2.8"/><circle cx="190" cy="410" r="2.8"/><circle cx="190" cy="350" r="2.8"/><circle cx="190" cy="290" r="2.8"/><circle cx="190" cy="230" r="2.8"/>
    <circle cx="240" cy="530" r="2.8"/><circle cx="240" cy="470" r="2.8"/><circle cx="240" cy="410" r="2.8"/><circle cx="240" cy="350" r="2.8"/><circle cx="240" cy="290" r="2.8"/><circle cx="240" cy="230" r="2.8"/>
    <circle cx="290" cy="530" r="2.8"/><circle cx="290" cy="470" r="2.8"/><circle cx="290" cy="410" r="2.8"/><circle cx="290" cy="350" r="2.8"/><circle cx="290" cy="290" r="2.8"/><circle cx="290" cy="230" r="2.8"/>
    <circle cx="340" cy="530" r="2.8"/><circle cx="340" cy="470" r="2.8"/><circle cx="340" cy="410" r="2.8"/><circle cx="340" cy="350" r="2.8"/><circle cx="340" cy="290" r="2.8"/><circle cx="340" cy="230" r="2.8"/>
    <circle cx="390" cy="530" r="2.8"/><circle cx="390" cy="470" r="2.8"/><circle cx="390" cy="410" r="2.8"/><circle cx="390" cy="350" r="2.8"/><circle cx="390" cy="290" r="2.8"/><circle cx="390" cy="230" r="2.8"/>
    <circle cx="440" cy="530" r="2.8"/><circle cx="440" cy="470" r="2.8"/><circle cx="440" cy="410" r="2.8"/><circle cx="440" cy="350" r="2.8"/><circle cx="440" cy="290" r="2.8"/><circle cx="440" cy="230" r="2.8"/>
    <circle cx="490" cy="530" r="2.8"/><circle cx="490" cy="470" r="2.8"/><circle cx="490" cy="410" r="2.8"/><circle cx="490" cy="350" r="2.8"/><circle cx="490" cy="290" r="2.8"/><circle cx="490" cy="230" r="2.8"/>
    <circle cx="540" cy="530" r="2.8"/><circle cx="540" cy="470" r="2.8"/><circle cx="540" cy="410" r="2.8"/><circle cx="540" cy="350" r="2.8"/><circle cx="540" cy="290" r="2.8"/><circle cx="540" cy="230" r="2.8"/>
    <circle cx="590" cy="530" r="2.8"/><circle cx="590" cy="470" r="2.8"/><circle cx="590" cy="410" r="2.8"/><circle cx="590" cy="350" r="2.8"/><circle cx="590" cy="290" r="2.8"/><circle cx="590" cy="230" r="2.8"/>
  </g>

  <g class="counted">
    <circle cx="190" cy="530" r="5"/>
    <circle cx="290" cy="530" r="5"/><circle cx="290" cy="470" r="5"/>
    <circle cx="390" cy="530" r="5"/><circle cx="390" cy="470" r="5"/><circle cx="390" cy="410" r="5"/>
    <circle cx="490" cy="530" r="5"/><circle cx="490" cy="470" r="5"/><circle cx="490" cy="410" r="5"/><circle cx="490" cy="350" r="5"/><circle cx="490" cy="290" r="5"/>
    <circle cx="590" cy="530" r="5"/><circle cx="590" cy="470" r="5"/><circle cx="590" cy="410" r="5"/><circle cx="590" cy="350" r="5"/><circle cx="590" cy="290" r="5"/><circle cx="590" cy="230" r="5"/>
  </g>

  <g class="pair">
    <path d="M390 350L340 410"/><path d="M390 290L340 470"/><path d="M390 230L340 530"/><path d="M490 230L240 530"/>
  </g>
  <g class="paired">
    <circle cx="390" cy="350" r="5"/><circle cx="390" cy="290" r="5"/><circle cx="390" cy="230" r="5"/><circle cx="490" cy="230" r="5"/>
    <circle cx="340" cy="410" r="5"/><circle cx="340" cy="470" r="5"/><circle cx="340" cy="530" r="5"/><circle cx="240" cy="530" r="5"/>
  </g>
  <circle class="center" cx="365" cy="380" r="5"/>

  <g class="small" text-anchor="middle">
    <text x="140" y="613">1</text><text x="190" y="613">2</text><text x="240" y="613">3</text><text x="290" y="613">4</text><text x="340" y="613">5</text>
    <text x="390" y="613">6</text><text x="440" y="613">7</text><text x="490" y="613">8</text><text x="540" y="613">9</text><text x="590" y="613">10</text>
  </g>
  <g class="small" text-anchor="end">
    <text x="80" y="535">1</text><text x="80" y="475">2</text><text x="80" y="415">3</text><text x="80" y="355">4</text><text x="80" y="295">5</text><text x="80" y="235">6</text>
  </g>

  <text class="point-label" x="73" y="611">A</text><text class="point-label" x="649" y="165">B</text><text class="point-label" x="650" y="580">C</text>
  <text class="point-label" x="72" y="374">K</text><text class="point-label" x="355" y="616">L</text><text class="point-label" x="344" y="373">M</text><text class="point-label" x="373" y="188">T</text>
  <text class="small" x="380" y="148">x = p/2</text><text class="small" x="646" y="375">y = ℓ/2</text>
  <text class="label" x="521" y="245" transform="rotate(-37.4 521 245)">y = (ℓ/p)x</text>
  <text class="label" x="677" y="608">x</text><text class="label" x="72" y="135">y</text><text class="label" x="646" y="613">p</text><text class="label" x="66" y="176">ℓ</text>

  <text class="region" x="247" y="458" fill="#08746e">AML</text><text class="region" x="205" y="337" fill="#a06b00">AMK</text>
  <text class="region" x="510" y="416" fill="#416b91">LMBC</text><text class="region" x="500" y="275" fill="#b95740">BMT</text>

  <rect class="card" x="735" y="102" width="375" height="154" rx="13"/>
  <text class="subheading" x="760" y="133">Что отмечено</text>
  <circle class="legend-teal" cx="772" cy="166" r="5"/><text class="small" x="790" y="171">чётные x под AB: E(ABC) = 17</text>
  <circle class="legend-coral" cx="772" cy="198" r="5"/><text class="small" x="790" y="203">пары при повороте на 180° вокруг M</text>
  <circle class="node" cx="772" cy="230" r="3.3"/><text class="small" x="790" y="235">остальные целые узлы решётки</text>

  <rect class="card" x="735" y="274" width="375" height="245" rx="13"/>
  <text class="subheading" x="760" y="306">Чётности областей</text>
  <text class="formula" x="760" y="342">E(LMBC) = 14 ≡ 4 = E(BMT)  (mod 2)</text>
  <text class="small" x="760" y="367">вместе — ℓ−1 узлов на каждой чётной вертикали</text>
  <text class="formula" x="760" y="406">E(BMT) = 4 = O(AML)</text>
  <text class="small" x="760" y="431">центральная симметрия меняет чётность x</text>
  <text class="formula-strong" x="760" y="472">E(ABC) ≡ #AML = 7  (mod 2)</text>
  <text class="formula" x="760" y="500">#AMK = 8,     #AML + #AMK = 15</text>

  <rect class="result" x="735" y="538" width="375" height="88" rx="13"/>
  <text class="small" x="760" y="568">общая формула</text>
  <text class="formula-strong" x="760" y="601">(ℓ/p)(p/ℓ) = (−1)^((p−1)(ℓ−1)/4)</text>

  <rect x="62" y="646" width="1048" height="34" rx="9" fill="#edf4fb"/>
  <text class="small" x="586" y="668" text-anchor="middle">AM не содержит целых узлов: из ℓx = py при 0 &lt; x &lt; p следовало бы p | x</text>
</svg>
