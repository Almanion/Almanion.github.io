<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
  <title id="title">Геометрический смысл леммы Эйзенштейна</title>
  <desc id="desc">Для примера p равно 11 и q равно 7 отмечены целые точки на вертикалях x равно 2i под прямой y равно q делить на p, умноженное на x.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#173f70"/>
    </marker>
    <style>
      .axis{stroke:#173f70;stroke-width:3;marker-end:url(#arrow)}
      .grid{stroke:#cbd8e7;stroke-width:1.2}
      .even{stroke:#0b8f87;stroke-width:7;opacity:.12}
      .bound{stroke:#6682a3;stroke-width:2;stroke-dasharray:7 7}
      .graph{stroke:#0b8f87;stroke-width:4;fill:none}
      .point{fill:#0b8f87;stroke:#fff;stroke-width:2}
      .label{font:22px Georgia,serif;fill:#173f70}
      .small{font:18px system-ui,sans-serif;fill:#415d7a}
      .area{fill:#0b8f87;opacity:.07}
    </style>
  </defs>

  <!-- Масштаб примера: p=11, q=7; 60 px по x и 55 px по y. -->
  <path class="area" d="M110 470H770V85Z"/>
  <g aria-hidden="true">
    <path class="even" d="M230 470V85M350 470V85M470 470V85M590 470V85M710 470V85"/>
    <path class="grid" d="M170 470V85M230 470V85M290 470V85M350 470V85M410 470V85M470 470V85M530 470V85M590 470V85M650 470V85M710 470V85M770 470V85"/>
    <path class="grid" d="M110 415H770M110 360H770M110 305H770M110 250H770M110 195H770M110 140H770M110 85H770"/>
  </g>
  <path class="bound" d="M770 470V85H110"/>
  <path class="axis" d="M82 470H832"/>
  <path class="axis" d="M110 505V42"/>
  <path class="graph" d="M110 470L770 85"/>

  <!-- Точки (2i,j), 1 <= j <= floor(2qi/p). -->
  <g class="point">
    <circle cx="230" cy="415" r="7"/>
    <circle cx="350" cy="415" r="7"/><circle cx="350" cy="360" r="7"/>
    <circle cx="470" cy="415" r="7"/><circle cx="470" cy="360" r="7"/><circle cx="470" cy="305" r="7"/>
    <circle cx="590" cy="415" r="7"/><circle cx="590" cy="360" r="7"/><circle cx="590" cy="305" r="7"/><circle cx="590" cy="250" r="7"/><circle cx="590" cy="195" r="7"/>
    <circle cx="710" cy="415" r="7"/><circle cx="710" cy="360" r="7"/><circle cx="710" cy="305" r="7"/><circle cx="710" cy="250" r="7"/><circle cx="710" cy="195" r="7"/><circle cx="710" cy="140" r="7"/>
  </g>

  <text class="label" x="790" y="458">p</text>
  <text class="label" x="126" y="62">q</text>
  <text class="label" x="552" y="177" transform="rotate(-30.3 552 177)">y = (q/p)x</text>
  <text class="small" x="197" y="525">чётные вертикали x = 2i</text>
  <text class="small" x="488" y="552">пример: p = 11, q = 7</text>
  <text class="small" x="445" y="448">j ≤ ⌊2qi/p⌋</text>
</svg>
