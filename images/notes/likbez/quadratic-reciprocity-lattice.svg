<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Полуинтервалы в доказательстве леммы Эйзенштейна</title>
  <desc id="desc">На примере p равно 11 и a равно 7 показано, в какой полуинтервал длины p пополам попадает каждое число ai. Нечётный номер полуинтервала соответствует отрицательному наименьшему вычету.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#173f70"/>
    </marker>
    <style>
      .frame{fill:#fbfdff;stroke:#d6e1ed;stroke-width:2}
      .even{fill:#e8f5f3}.odd{fill:#fff0e8}
      .boundary{stroke:#91a8c0;stroke-width:1.5;stroke-dasharray:6 6}
      .axis{stroke:#173f70;stroke-width:3;marker-end:url(#arrow)}
      .point-pos{fill:#0b8f87;stroke:#fff;stroke-width:3}.point-neg{fill:#d4674c;stroke:#fff;stroke-width:3}
      .title{font:700 25px system-ui,sans-serif;fill:#173f70}.formula{font:22px Georgia,serif;fill:#173f70}
      .small{font:16px system-ui,sans-serif;fill:#526b84}.band{font:700 17px system-ui,sans-serif;text-anchor:middle}
      .band-even{fill:#08746e}.band-odd{fill:#bb553c}.table-line{stroke:#d6e1ed;stroke-width:1.4}
      .table-head{font:700 17px system-ui,sans-serif;fill:#173f70}.table-text{font:18px Georgia,serif;fill:#294a6e;text-anchor:middle}
      .conclusion{font:700 19px system-ui,sans-serif;fill:#173f70}
    </style>
  </defs>

  <rect class="frame" x="18" y="18" width="964" height="584" rx="18"/>
  <text class="title" x="48" y="58">Почему важна чётность  tᵢ = ⌊2ai / p⌋</text>
  <text class="formula" x="48" y="92">tᵢp/2 &lt; ai &lt; (tᵢ+1)p/2</text>
  <g transform="translate(610 72)">
    <rect class="even" x="0" y="-19" width="28" height="22" rx="5"/>
    <text class="small" x="38" y="-3">tᵢ чётно  →  наименьший вычет положителен</text>
    <rect class="odd" x="0" y="12" width="28" height="22" rx="5"/>
    <text class="small" x="38" y="28">tᵢ нечётно →  наименьший вычет отрицателен</text>
  </g>

  <g>
    <rect class="even" x="80" y="132" width="120" height="188"/><rect class="odd" x="200" y="132" width="120" height="188"/>
    <rect class="even" x="320" y="132" width="120" height="188"/><rect class="odd" x="440" y="132" width="120" height="188"/>
    <rect class="even" x="560" y="132" width="120" height="188"/><rect class="odd" x="680" y="132" width="120" height="188"/>
    <rect class="even" x="800" y="132" width="120" height="188"/>
    <path class="boundary" d="M80 132V320M200 132V320M320 132V320M440 132V320M560 132V320M680 132V320M800 132V320M920 132V320"/>
  </g>

  <g class="band">
    <text class="band-even" x="140" y="158">t = 0 · +</text><text class="band-odd" x="260" y="158">t = 1 · −</text>
    <text class="band-even" x="380" y="158">t = 2 · +</text><text class="band-odd" x="500" y="158">t = 3 · −</text>
    <text class="band-even" x="620" y="158">t = 4 · +</text><text class="band-odd" x="740" y="158">t = 5 · −</text>
    <text class="band-even" x="860" y="158">t = 6 · +</text>
  </g>

  <g>
    <circle class="point-neg" cx="233" cy="231" r="10"/><circle class="point-pos" cx="385" cy="260" r="10"/>
    <circle class="point-neg" cx="538" cy="231" r="10"/><circle class="point-neg" cx="691" cy="260" r="10"/>
    <circle class="point-pos" cx="844" cy="231" r="10"/>
    <text class="formula" x="209" y="207">7·1</text><text class="formula" x="357" y="294">7·2</text>
    <text class="formula" x="510" y="207">7·3</text><text class="formula" x="663" y="294">7·4</text>
    <text class="formula" x="816" y="207">7·5</text>
  </g>

  <path class="axis" d="M62 320H948"/>
  <g class="small" text-anchor="middle">
    <text x="80" y="347">0</text><text x="200" y="347">p/2</text><text x="320" y="347">p</text><text x="440" y="347">3p/2</text>
    <text x="560" y="347">2p</text><text x="680" y="347">5p/2</text><text x="800" y="347">3p</text><text x="920" y="347">7p/2</text>
  </g>
  <text class="small" x="77" y="376">пример: p = 11, a = 7</text>

  <g>
    <path class="table-line" d="M80 408H920M80 447H920M80 486H920M80 525H920M80 564H920M80 408V564M245 408V564M380 408V564M515 408V564M650 408V564M785 408V564M920 408V564"/>
    <text class="table-head" x="96" y="434">i</text><text class="table-head" x="96" y="473">ai</text>
    <text class="table-head" x="96" y="512">tᵢ</text><text class="table-head" x="96" y="551">наим. вычет</text>
    <g class="table-text">
      <text x="313" y="434">1</text><text x="448" y="434">2</text><text x="583" y="434">3</text><text x="718" y="434">4</text><text x="853" y="434">5</text>
      <text x="313" y="473">7</text><text x="448" y="473">14</text><text x="583" y="473">21</text><text x="718" y="473">28</text><text x="853" y="473">35</text>
      <text x="313" y="512" fill="#bb553c">1</text><text x="448" y="512">2</text><text x="583" y="512" fill="#bb553c">3</text><text x="718" y="512" fill="#bb553c">5</text><text x="853" y="512">6</text>
      <text x="313" y="551" fill="#bb553c">−4</text><text x="448" y="551">+3</text><text x="583" y="551" fill="#bb553c">−1</text><text x="718" y="551" fill="#bb553c">−5</text><text x="853" y="551">+2</text>
    </g>
  </g>
  <text class="conclusion" x="80" y="590">3 отрицательных вычета;  1+2+3+5+6 = 17  ⇒  чётности совпадают</text>
</svg>
