<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Квадратная решётка кратных гауссова числа b</title>
  <desc id="desc">Ортогональные векторы b и ib одинаковой длины порождают квадратную решётку. Точка a соединена с ближайшим узлом qb вектором остатка r.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#173f70"/>
    </marker>
    <style>
      .axis{stroke:#173f70;stroke-width:3;marker-end:url(#arrow)}
      .lat{stroke:#9bb8d4;stroke-width:1.7}
      .cell{fill:#0b8f87;opacity:.08;stroke:#0b8f87;stroke-width:2}
      .basis{stroke:#0b8f87;stroke-width:5;marker-end:url(#arrow)}
      .rem{stroke:#d4674c;stroke-width:5;stroke-dasharray:9 6;marker-end:url(#arrow)}
      .node{fill:#173f70}
      .near{fill:#0b8f87;stroke:#fff;stroke-width:3}
      .point{fill:#d4674c;stroke:#fff;stroke-width:3}
      .label{font:23px Georgia,serif;fill:#173f70}
      .small{font:19px system-ui,sans-serif;fill:#415d7a}
    </style>
  </defs>

  <path class="axis" d="M55 500H850"/>
  <path class="axis" d="M180 585V48"/>

  <!-- Локальная квадратная сетка повёрнута вместе с b. Шаг равен |b|. -->
  <g transform="translate(180 480) rotate(-26.565)">
    <path class="cell" d="M0 0H179V-179H0Z"/>
    <g class="lat" aria-hidden="true">
      <path d="M-358 -537V358M-179 -537V358M0 -537V358M179 -537V358M358 -537V358M537 -537V358M716 -537V358"/>
      <path d="M-358 -537H716M-358 -358H716M-358 -179H716M-358 0H716M-358 179H716M-358 358H716"/>
    </g>
    <g class="node">
      <circle cx="-179" cy="179" r="7"/><circle cx="0" cy="179" r="7"/><circle cx="179" cy="179" r="7"/><circle cx="358" cy="179" r="7"/><circle cx="537" cy="179" r="7"/>
      <circle cx="-179" cy="0" r="7"/><circle cx="0" cy="0" r="7"/><circle cx="179" cy="0" r="7"/><circle cx="358" cy="0" r="7"/><circle cx="537" cy="0" r="7"/>
      <circle cx="-179" cy="-179" r="7"/><circle cx="0" cy="-179" r="7"/><circle cx="179" cy="-179" r="7"/><circle cx="358" cy="-179" r="7"/><circle cx="537" cy="-179" r="7"/>
      <circle cx="-179" cy="-358" r="7"/><circle cx="0" cy="-358" r="7"/><circle cx="179" cy="-358" r="7"/><circle cx="358" cy="-358" r="7"/><circle cx="537" cy="-358" r="7"/>
    </g>
  </g>

  <!-- b=(160,-80), ib=(-80,-160): одинаковая длина и нулевое скалярное произведение. -->
  <path class="basis" d="M180 480L340 400"/>
  <path class="basis" d="M180 480L100 320"/>

  <circle class="near" cx="260" cy="240" r="12"/>
  <circle class="point" cx="230" cy="315" r="12"/>
  <path class="rem" d="M260 240L233 307"/>

  <text class="label" x="824" y="534">Re</text>
  <text class="label" x="196" y="67">Im</text>
  <text class="label" x="350" y="398">b</text>
  <text class="label" x="75" y="305">ib</text>
  <text class="label" x="274" y="225">qb</text>
  <text class="label" x="205" y="349">a</text>
  <text class="label" x="278" y="286">r = a − qb</text>
  <text class="small" x="505" y="574">узлы: (k + ℓi)b, k, ℓ ∈ ℤ</text>
</svg>
