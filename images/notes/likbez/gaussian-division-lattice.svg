<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Решётка кратных гауссова числа b</title>
  <desc id="desc">Квадратная решётка, порождённая векторами b и ib, с отмеченной точкой a, ближайшим узлом qb и остатком r.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#173f70"/>
    </marker>
    <style>
      .axis{stroke:#173f70;stroke-width:3;marker-end:url(#arrow)}
      .lat{stroke:#9bb8d4;stroke-width:1.7}
      .basis{stroke:#0b8f87;stroke-width:5;marker-end:url(#arrow)}
      .rem{stroke:#d4674c;stroke-width:5;stroke-dasharray:9 6;marker-end:url(#arrow)}
      .node{fill:#173f70}
      .near{fill:#0b8f87}
      .point{fill:#d4674c}
      .label{font:23px Georgia,serif;fill:#173f70}
      .small{font:19px system-ui,sans-serif;fill:#415d7a}
    </style>
  </defs>

  <g aria-hidden="true">
    <path class="lat" d="M-70 545L760 165M-20 655L810 275M30 765L860 385M80 875L910 495"/>
    <path class="lat" d="M-70 325L760 -55M-20 435L810 55M30 545L860 165M80 655L910 275M130 765L960 385"/>
    <path class="lat" d="M55 -10L435 820M165 -60L545 770M275 -110L655 720M385 -160L765 670M495 -210L875 620M605 -260L985 570"/>
  </g>

  <path class="axis" d="M55 500H850"/>
  <path class="axis" d="M185 585V48"/>

  <path class="basis" d="M185 500L353 424"/>
  <path class="basis" d="M185 500L262 332"/>

  <g class="node">
    <circle cx="185" cy="500" r="7"/><circle cx="353" cy="424" r="7"/><circle cx="521" cy="348" r="7"/>
    <circle cx="689" cy="272" r="7"/><circle cx="17" cy="576" r="7"/>
    <circle cx="262" cy="332" r="7"/><circle cx="430" cy="256" r="7"/><circle cx="598" cy="180" r="7"/>
    <circle cx="766" cy="104" r="7"/><circle cx="339" cy="164" r="7"/><circle cx="507" cy="88" r="7"/>
    <circle cx="108" cy="668" r="7"/><circle cx="276" cy="592" r="7"/><circle cx="444" cy="516" r="7"/>
    <circle cx="612" cy="440" r="7"/><circle cx="780" cy="364" r="7"/>
  </g>

  <circle class="near" cx="430" cy="256" r="12"/>
  <circle class="point" cx="475" cy="295" r="12"/>
  <path class="rem" d="M430 256L468 289"/>

  <text class="label" x="824" y="533">Re</text>
  <text class="label" x="201" y="67">Im</text>
  <text class="label" x="354" y="410">b</text>
  <text class="label" x="269" y="318">ib</text>
  <text class="label" x="385" y="238">qb</text>
  <text class="label" x="486" y="302">a</text>
  <text class="label" x="486" y="260">r = a − qb</text>
  <text class="small" x="520" y="570">узлы: (k + ℓi)b, k, ℓ ∈ ℤ</text>
</svg>
