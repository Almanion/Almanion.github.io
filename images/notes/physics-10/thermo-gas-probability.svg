<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 535" role="img" aria-labelledby="title desc">
<title id="title">Четыре молекулы в одной половине сосуда</title><desc id="desc">Четыре пронумерованные молекулы находятся в левой половине сосуда. Пунктир обозначает мысленное деление, а не перегородку. Вероятность такого расположения всех четырёх молекул в выбранной половине составляет одну шестнадцатую.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 4.5 L1.5 7.5" fill="none" stroke="#263747" stroke-width="1.7"/></marker><marker id="route" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#2366a4" stroke-width="1.8"/></marker><marker id="warm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#b54b38" stroke-width="1.8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}.small{font-size:21px}.heading{font-size:27px;font-weight:600}.wall{stroke:#263747;stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#263747;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.flow{stroke:#2366a4;stroke-width:2.4;fill:none;marker-end:url(#route)}.work{stroke:#263747;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.guide{stroke:#8193a5;stroke-width:1.3;stroke-dasharray:6 6;fill:none}.leader{stroke:#8193a5;stroke-width:1.3;fill:none}</style>
<rect width="700" height="535" rx="12" fill="#fff"/>
<text x="350" y="42" class="heading" text-anchor="middle" >Газ в одной половине сосуда</text>
<rect x="65" y="110" width="570" height="285" rx="0" fill="#f7fbfd" stroke="#263747" stroke-width="2"/>
<path d="M350 110 V395" class="guide" />
<text x="207" y="82" class="small" text-anchor="middle" >Левая половина</text>
<text x="492" y="82" class="small" text-anchor="middle" >Правая половина</text>
<circle cx="170" cy="195" r="27" fill="#e0eff9" stroke="#2366a4" stroke-width="2.3"/>
<text x="170" y="203" class="" text-anchor="middle" >1</text>
<circle cx="270" cy="195" r="27" fill="#e0eff9" stroke="#2366a4" stroke-width="2.3"/>
<text x="270" y="203" class="" text-anchor="middle" >2</text>
<circle cx="170" cy="305" r="27" fill="#e0eff9" stroke="#2366a4" stroke-width="2.3"/>
<text x="170" y="313" class="" text-anchor="middle" >3</text>
<circle cx="270" cy="305" r="27" fill="#e0eff9" stroke="#2366a4" stroke-width="2.3"/>
<text x="270" y="313" class="" text-anchor="middle" >4</text>
<text x="492" y="260" class="" text-anchor="middle" >Пусто</text>
<text x="350" y="445" class="small" text-anchor="middle" >Пунктир — мысленное деление сосуда</text>
<text x="350" y="495" class="math" text-anchor="middle" >W = (1/2)⁴ = 1/16</text>
</svg>
