<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 628 404" role="img" aria-labelledby="title desc">
<title id="title">Изотермы Эндрюса и область сосуществования фаз</title>
<desc id="desc">Под пунктирным куполом сосуществуют жидкость и насыщенный пар. Горизонтальные участки укорачиваются с ростом температуры и сходятся к критической точке K. Через K проведены проекции pкр и Vкр.</desc>

<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#263747}
.axis,.iso,.guide,.model,.boundary,.spin,.leader{fill:none;stroke-linecap:round;stroke-linejoin:round}
.axis{stroke:#263747;stroke-width:2.2}.iso{stroke:#1e5c92;stroke-width:3.4}
.guide{stroke:#718393;stroke-width:1.5;stroke-dasharray:5 5}
.model{stroke:#a55228;stroke-width:2.6;stroke-dasharray:7 5}
.boundary{stroke:#136f70;stroke-width:3}.spin{stroke:#754774;stroke-width:2.2;stroke-dasharray:7 5}
.leader{stroke:#506679;stroke-width:1.3}
.math{font:italic 25px Georgia,'Times New Roman',serif}.small{font-size:19px}.phase{font-weight:600;font-size:21px}
</style>
