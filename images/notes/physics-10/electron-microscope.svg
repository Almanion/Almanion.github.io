<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 955" role="img" aria-labelledby="title desc">
<title id="title">Схема электронного микроскопа</title><desc id="desc">Катод и анод создают ускоренный пучок электронов в вакууме. Конденсорная линза освещает тонкий образец, расположенный перед объективной линзой. Объективная и проекционная линзы формируют изображение на экране. Зелёные линии условно показывают ход пучка.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#263747" stroke-width="1.5"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#b85032" stroke-width="2"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263747}.heading{font-size:26px;font-weight:600}.label{font-size:24px}.small{font-size:22px}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:27px}.wall{fill:none;stroke:#263747;stroke-width:2.5;stroke-linejoin:round}.leader{fill:none;stroke:#8291a2;stroke-width:1.5}.guide{fill:none;stroke:#8291a2;stroke-width:1.5;stroke-dasharray:6 6}.axis{fill:none;stroke:#263747;stroke-width:1.8;marker-end:url(#arrow)}.dimension{fill:none;stroke:#8455a5;stroke-width:1.8;marker-start:url(#arrow);marker-end:url(#arrow)}.ray{fill:none;stroke:#b85032;stroke-width:3;marker-end:url(#red-arrow)}.signal{fill:none;stroke:#176da3;stroke-width:2;marker-end:url(#arrow)}.beam{fill:none;stroke:#087f80;stroke-width:2.8;stroke-linejoin:round}</style>
<rect width="720" height="955" rx="12" fill="#fff"/><text x="28.000" y="40.000" class="heading" >Электронный микроскоп</text><rect x="226" y="92" width="220" height="785" fill="#f5fbff" rx="14" stroke="#7fa8bf" stroke-width="2.5"/><line x1="335.000" y1="143.000" x2="335.000" y2="821.000" class="guide" /><path d="M335 160L325 200L295 270L315 360L280 440L335 550L290 650L270 820" class="beam" id="electron-left-ray"/><path d="M335 160L345 200L375 270L355 360L390 440L335 550L380 650L400 820" class="beam" id="electron-right-ray"/><path d="M307 111H363L351 136H319Z" class="wall" style="fill:#176da3" id="electron-cathode"/><circle cx="335.000" cy="153.000" r="4" fill="#176da3" /><rect x="247" y="197" width="68" height="7" fill="#263747" /><rect x="355" y="197" width="70" height="7" fill="#263747" /><rect x="207" y="248" width="47" height="44" fill="#e2f2ef" rx="8" stroke="#087f80" stroke-width="2.5" id="electron-condenser-left"/><rect x="416" y="248" width="47" height="44" fill="#e2f2ef" rx="8" stroke="#087f80" stroke-width="2.5" id="electron-condenser-right"/><rect x="207" y="418" width="47" height="44" fill="#e2f2ef" rx="8" stroke="#087f80" stroke-width="2.5" id="electron-objective-left"/><rect x="416" y="418" width="47" height="44" fill="#e2f2ef" rx="8" stroke="#087f80" stroke-width="2.5" id="electron-objective-right"/><rect x="207" y="628" width="47" height="44" fill="#e2f2ef" rx="8" stroke="#087f80" stroke-width="2.5" id="electron-projector-left"/><rect x="416" y="628" width="47" height="44" fill="#e2f2ef" rx="8" stroke="#087f80" stroke-width="2.5" id="electron-projector-right"/><rect x="299" y="357" width="72" height="6" fill="#b85032" id="electron-specimen"/><rect x="245" y="820" width="180" height="8" fill="#f4dfb6" stroke="#263747" stroke-width="2" id="electron-screen"/><line x1="363.000" y1="125.000" x2="476.000" y2="125.000" class="leader" /><text x="490.000" y="143.000" class="small" >Катод</text><line x1="425.000" y1="201.000" x2="476.000" y2="201.000" class="leader" /><text x="490.000" y="209.000" class="small" >Анод</text><line x1="463.000" y1="270.000" x2="476.000" y2="270.000" class="leader" /><text x="490.000" y="273.000" class="small" >Конденсорная</text><text x="490.000" y="302.000" class="small" >линза</text><line x1="371.000" y1="360.000" x2="476.000" y2="360.000" class="leader" /><text x="490.000" y="369.000" class="small" >Образец</text><line x1="463.000" y1="440.000" x2="476.000" y2="440.000" class="leader" /><text x="490.000" y="444.000" class="small" >Объективная</text><text x="490.000" y="473.000" class="small" >линза</text><line x1="463.000" y1="650.000" x2="476.000" y2="650.000" class="leader" /><text x="490.000" y="654.000" class="small" >Проекционная</text><text x="490.000" y="683.000" class="small" >линза</text><line x1="425.000" y1="824.000" x2="476.000" y2="824.000" class="leader" /><text x="490.000" y="834.000" class="small" >Экран</text><text x="239.000" y="856.000" class="small" >Вакуум</text><text x="360.000" y="928.000" class="small" text-anchor="middle">Схема просвечивающего микроскопа</text>
</svg>
