<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Схема электронного микроскопа</title>
  <desc id="desc">Пучок электронов идёт от катода через три электромагнитные линзы и формирует изображение на экране.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0b8f87"/>
    </marker>
    <style>
      .frame{fill:#fbfdff;stroke:#d6e1ed;stroke-width:2}.axis{stroke:#b7c7d7;stroke-width:2;stroke-dasharray:7 8}
      .beam{fill:none;stroke:#0b8f87;stroke-width:3;marker-end:url(#arrow)}.lens{fill:#e8f5f3;stroke:#0b8f87;stroke-width:3}
      .source{fill:#173f70}.screen{fill:#fff4df;stroke:#d59b37;stroke-width:3}.heading{font:700 26px system-ui,sans-serif;fill:#173f70}
      .label{font:20px system-ui,sans-serif;fill:#173f70}.small{font:16px system-ui,sans-serif;fill:#526b84}
    </style>
  </defs>
  <rect class="frame" x="20" y="20" width="860" height="680" rx="20"/>
  <text class="heading" x="450" y="64" text-anchor="middle">Электронный микроскоп</text>
  <path class="axis" d="M450 100V636"/>
  <path class="source" d="M398 105H502L480 142H420Z"/>
  <circle class="source" cx="450" cy="152" r="8"/>
  <text class="label" x="540" y="132">Катод</text>
  <path class="beam" d="M450 160L386 248L450 329"/>
  <path class="beam" d="M450 160L514 248L450 329"/>
  <path class="beam" d="M450 329L380 414L450 497"/>
  <path class="beam" d="M450 329L520 414L450 497"/>
  <path class="beam" d="M450 497L416 584"/>
  <path class="beam" d="M450 497L484 584"/>
  <g>
    <rect class="lens" x="316" y="227" width="55" height="58" rx="9"/>
    <rect class="lens" x="529" y="227" width="55" height="58" rx="9"/>
    <rect class="lens" x="302" y="389" width="55" height="58" rx="9"/>
    <rect class="lens" x="543" y="389" width="55" height="58" rx="9"/>
    <rect class="lens" x="349" y="548" width="55" height="58" rx="9"/>
    <rect class="lens" x="496" y="548" width="55" height="58" rx="9"/>
  </g>
  <path class="screen" d="M332 627Q450 603 568 627L553 660Q450 638 347 660Z"/>
  <text class="label" x="604" y="650">Экран</text>
  <text class="small" x="620" y="256">электромагнитная линза</text>
  <path d="M607 262H581" stroke="#526b84" stroke-width="1.8"/>
  <text class="small" x="620" y="418">электромагнитная линза</text>
  <path d="M607 424H596" stroke="#526b84" stroke-width="1.8"/>
</svg>
