<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="title desc">
<title id="title">Установка метода Клемана — Дезорма</title><desc id="desc">Газовый сосуд герметично закрыт пробкой. Кран k1 ведёт к насосу, k2 открывает сосуд в атмосферу. Открытый U-манометр показывает избыточное давление: в соединённом с газом колене уровень ниже.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#263747" stroke-width="1.8"/></marker><marker id="route" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2366a4" stroke-width="2.5"/></marker><pattern id="shade" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#aac5db" stroke-width="1.2"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:27px}.small{font-size:21px}.heading{font-size:26px;font-weight:600}.wall{stroke:#263747;stroke-width:2.6;fill:none;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#263747;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.curve{stroke:#2366a4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#8193a5;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.pipe{stroke:#263747;stroke-width:8;fill:none;stroke-linejoin:round;stroke-linecap:round}.bore{stroke:#fff;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="720" height="590" rx="12" fill="#fff"/><text x="350" y="43" class="heading" text-anchor="middle">Метод Клемана — Дезорма</text><rect x="73" y="260" width="254" height="247" rx="0" fill="#f4f8fb" stroke="none" stroke-width="2.6"/><path d="M73 260 V490 Q73 507 90 507 H310 Q327 507 327 490 V260 H242 V223 H158 V260 Z" class="wall" /><rect x="155" y="216" width="90" height="17" rx="2" fill="#a5b4c4" stroke="#263747" stroke-width="2.6"/><path d="M176 249 V133" class="pipe" /><path d="M176 249 V133" class="bore" /><circle cx="176" cy="168" r="11" fill="#fff" stroke="#263747" stroke-width="2.5"/><path d="M170 153 L182 183" class="wall" /><text x="176" y="142" class="math" text-anchor="middle">k₂</text><path d="M176 126 L176 92" class="axis" /><text x="124" y="81" class="small" text-anchor="middle">Атмосфера</text><path d="M222 249 V123 Q222 107 239 107 H552" class="pipe" /><path d="M222 249 V123 Q222 107 239 107 H552" class="bore" /><circle cx="438" cy="107" r="11" fill="#fff" stroke="#263747" stroke-width="2.5"/><path d="M432 92 L444 122" class="wall" /><text x="438" y="81" class="math" text-anchor="middle">k₁</text><path d="M535 107 L481 107" class="curve" marker-end="url(#route)"/><text x="563" y="117" class="small" text-anchor="start">От насоса</text><path d="M355 107 V373 Q355 430 410 430 Q465 430 465 373 V233" class="pipe" /><path d="M355 107 V373 Q355 430 410 430 Q465 430 465 373 V233" class="bore" /><path d="M355 338 V373 Q355 430 410 430 Q465 430 465 373 V293" class="" stroke="#8da5b9" stroke-width="5" fill="none"/><path d="M355 338 L525 338" class="guide" /><path d="M465 293 L525 293" class="guide" /><path d="M520 293 L520 338" class="wall" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="535" y="325" class="math" text-anchor="start">h</text><text x="467" y="212" class="math" text-anchor="middle">p₀</text><text x="201" y="383" class="small" text-anchor="middle">Исследуемый</text><text x="201" y="415" class="small" text-anchor="middle">газ</text><text x="467" y="489" class="small" text-anchor="middle">Открытый манометр</text><text x="350" y="556" class="small" text-anchor="middle">k₁ — накачивание; k₂ — кратковременный выпуск</text></svg>