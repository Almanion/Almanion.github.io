<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1225" role="img" aria-labelledby="title desc">
<title id="title">Графики изохорного процесса</title><desc id="desc">Объём постоянен: график p(V) вертикален, V(T) горизонтален. Давление прямо пропорционально абсолютной температуре, поэтому прямая p(T) проходит через начало координат. Состояния 1 и 2 одинаковы во всех трёх графиках. Для одной массы газа при V1 меньше V2 меньше V3 наиболее крутая изохора соответствует V1.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#263747" stroke-width="1.7"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.heading{font-size:24px;font-weight:600}.small{font-size:21px}.math{font-family:Georgia,'Times New Roman',serif;font-size:27px;font-style:italic}.guide{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.axis{stroke:#263747;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.curve{stroke:#176da3;stroke-width:3.5;fill:none;stroke-linecap:round}</style>
<rect width="640" height="1225" rx="12" fill="#fff"/><text x="28.000" y="36.000" class="heading" >Изохорный процесс: V = const</text><line x1="74.000" y1="280.000" x2="289.000" y2="280.000" class="axis" id="isochoric-pv-axis-x"/><line x1="74.000" y1="280.000" x2="74.000" y2="125.000" class="axis" id="isochoric-pv-axis-y"/><text x="285.000" y="314.000" class="math" text-anchor="end">V</text><text x="55.000" y="129.000" class="math" text-anchor="end">p</text><text x="57.000" y="309.000" class="small" text-anchor="end">0</text><line x1="394.000" y1="280.000" x2="609.000" y2="280.000" class="axis" id="isochoric-vt-axis-x"/><line x1="394.000" y1="280.000" x2="394.000" y2="125.000" class="axis" id="isochoric-vt-axis-y"/><text x="605.000" y="314.000" class="math" text-anchor="end">T</text><text x="375.000" y="129.000" class="math" text-anchor="end">V</text><text x="377.000" y="309.000" class="small" text-anchor="end">0</text><line x1="192.000" y1="220.000" x2="192.000" y2="160.000" class="curve" id="isochoric-pv-process"/><line x1="472.000" y1="190.000" x2="550.000" y2="190.000" class="curve" id="isochoric-vt-process"/><line x1="74.000" y1="220.000" x2="192.000" y2="220.000" class="guide" /><text x="61.000" y="227.000" class="math" text-anchor="end">p<tspan baseline-shift="sub" font-size="70%" font-style="normal">1</tspan></text><circle cx="192.000" cy="220.000" r="5" fill="#176da3" id="isochoric-pv-state-1"/><text x="204.000" y="207.000" class="math" >1</text><line x1="472.000" y1="190.000" x2="472.000" y2="280.000" class="guide" /><text x="472.000" y="314.000" class="math" text-anchor="middle">T<tspan baseline-shift="sub" font-size="70%" font-style="normal">1</tspan></text><circle cx="472.000" cy="190.000" r="5" fill="#176da3" id="isochoric-vt-state-1"/><text x="484.000" y="177.000" class="math" >1</text><line x1="74.000" y1="160.000" x2="192.000" y2="160.000" class="guide" /><text x="61.000" y="167.000" class="math" text-anchor="end">p<tspan baseline-shift="sub" font-size="70%" font-style="normal">2</tspan></text><circle cx="192.000" cy="160.000" r="5" fill="#176da3" id="isochoric-pv-state-2"/><text x="204.000" y="147.000" class="math" >2</text><line x1="550.000" y1="190.000" x2="550.000" y2="280.000" class="guide" /><text x="550.000" y="314.000" class="math" text-anchor="middle">T<tspan baseline-shift="sub" font-size="70%" font-style="normal">2</tspan></text><circle cx="550.000" cy="190.000" r="5" fill="#176da3" id="isochoric-vt-state-2"/><text x="562.000" y="177.000" class="math" >2</text><line x1="192.000" y1="220.000" x2="192.000" y2="280.000" class="guide" /><text x="192.000" y="314.000" class="math" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan></text><line x1="394.000" y1="190.000" x2="472.000" y2="190.000" class="guide" /><text x="381.000" y="197.000" class="math" text-anchor="end">V<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan></text><text x="28.000" y="369.000" class="heading" >Давление пропорционально температуре</text><line x1="80.000" y1="690.000" x2="575.000" y2="690.000" class="axis" id="isochoric-pt-axis-x"/><line x1="80.000" y1="690.000" x2="80.000" y2="440.000" class="axis" id="isochoric-pt-axis-y"/><text x="571.000" y="724.000" class="math" text-anchor="end">T</text><text x="61.000" y="444.000" class="math" text-anchor="end">p</text><text x="63.000" y="719.000" class="small" text-anchor="end">0</text><line x1="80.000" y1="690.000" x2="222.000" y2="615.000" class="guide" style="stroke:#176da3;stroke-width:3" id="isochoric-pt-origin"/><line x1="222.000" y1="615.000" x2="364.000" y2="540.000" class="curve" id="isochoric-pt-process"/><text x="407.000" y="484.000" class="math" >p / T = const</text><line x1="80.000" y1="615.000" x2="222.000" y2="615.000" class="guide" /><line x1="222.000" y1="615.000" x2="222.000" y2="690.000" class="guide" /><text x="67.000" y="622.000" class="math" text-anchor="end">p<tspan baseline-shift="sub" font-size="70%" font-style="normal">1</tspan></text><text x="222.000" y="724.000" class="math" text-anchor="middle">T<tspan baseline-shift="sub" font-size="70%" font-style="normal">1</tspan></text><circle cx="222.000" cy="615.000" r="5" fill="#176da3" id="isochoric-pt-state-1"/><text x="234.000" y="602.000" class="math" >1</text><line x1="80.000" y1="540.000" x2="364.000" y2="540.000" class="guide" /><line x1="364.000" y1="540.000" x2="364.000" y2="690.000" class="guide" /><text x="67.000" y="547.000" class="math" text-anchor="end">p<tspan baseline-shift="sub" font-size="70%" font-style="normal">2</tspan></text><text x="364.000" y="724.000" class="math" text-anchor="middle">T<tspan baseline-shift="sub" font-size="70%" font-style="normal">2</tspan></text><circle cx="364.000" cy="540.000" r="5" fill="#176da3" id="isochoric-pt-state-2"/><text x="376.000" y="527.000" class="math" >2</text><text x="28.000" y="801.000" class="heading" >Семейство изохор</text><line x1="80.000" y1="1107.000" x2="575.000" y2="1107.000" class="axis" id="isochoric-family-axis-x"/><line x1="80.000" y1="1107.000" x2="80.000" y2="857.000" class="axis" id="isochoric-family-axis-y"/><text x="571.000" y="1141.000" class="math" text-anchor="end">T</text><text x="61.000" y="861.000" class="math" text-anchor="end">p</text><text x="63.000" y="1136.000" class="small" text-anchor="end">0</text><line x1="80.000" y1="1107.000" x2="133.100" y2="1082.250" class="guide" style="stroke:#176da3;stroke-width:3"/><line x1="133.100" y1="1082.250" x2="552.000" y2="887.000" class="curve" style="stroke:#176da3" id="isochore-1" data-volume="1"/><text x="562.000" y="894.000" class="math" style="fill:#176da3">V<tspan baseline-shift="sub" font-size="70%" font-style="normal">1</tspan></text><line x1="80.000" y1="1107.000" x2="133.100" y2="1094.625" class="guide" style="stroke:#087f80;stroke-width:3"/><line x1="133.100" y1="1094.625" x2="552.000" y2="997.000" class="curve" style="stroke:#087f80" id="isochore-2" data-volume="2"/><text x="562.000" y="1004.000" class="math" style="fill:#087f80">V<tspan baseline-shift="sub" font-size="70%" font-style="normal">2</tspan></text><line x1="80.000" y1="1107.000" x2="133.100" y2="1098.750" class="guide" style="stroke:#8455a5;stroke-width:3"/><line x1="133.100" y1="1098.750" x2="552.000" y2="1033.667" class="curve" style="stroke:#8455a5" id="isochore-3" data-volume="3"/><text x="562.000" y="1040.667" class="math" style="fill:#8455a5">V<tspan baseline-shift="sub" font-size="70%" font-style="normal">3</tspan></text><text x="80.000" y="1190.000" class="math" >V<tspan baseline-shift="sub" font-size="70%" font-style="normal">1</tspan> &lt; V<tspan baseline-shift="sub" font-size="70%" font-style="normal">2</tspan> &lt; V<tspan baseline-shift="sub" font-size="70%" font-style="normal">3</tspan></text>
</svg>
