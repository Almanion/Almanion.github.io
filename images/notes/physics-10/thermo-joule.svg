<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 465" role="img" aria-labelledby="title desc">
<title id="title">Опыт Джоуля</title><desc id="desc">Два опускающихся груза через блоки вращают вал с лопатками в сосуде с жидкостью. В сосуд погружён термометр.</desc>
