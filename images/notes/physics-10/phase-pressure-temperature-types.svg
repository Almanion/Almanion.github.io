<title id="title">Два вида диаграмм состояния p(T)</title>
<desc id="desc">На обеих схемах CА — линия сублимации, АB — плавления, АK — парообразования. А — тройная точка, K — критическая. На верхней схеме линия плавления наклонена вправо, на нижней — влево.</desc>

