<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 918" role="img" aria-labelledby="title desc">
<title id="title">Опыт Шарля: постоянный объём газа</title><desc id="desc">Сосуд с газом соединён с ртутным манометром непрерывной трубкой. В обоих состояниях поверхность ртути со стороны газа удерживают у одной метки, поэтому объём газа одинаков. При нагревании увеличиваются давление газа и разность уровней ртути.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#263747" stroke-width="1.7"/></marker><marker id="route" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#087f80" stroke-width="2.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.heading{font-size:24px;font-weight:600}.small{font-size:21px}.math{font-family:Georgia,'Times New Roman',serif;font-size:27px;font-style:italic}.guide{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.axis{stroke:#263747;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.wall{stroke:#263747;stroke-width:2.5;fill:none;stroke-linejoin:round}</style>
<rect width="720" height="918" rx="12" fill="#fff"/><g transform="translate(0 0)"><text x="28" y="34" class="heading">I. Начальное состояние</text><path d="M52 176 V348 H218 V176" fill="#e5f3fa" stroke="#64748b" stroke-width="2"/><text x="136" y="331" text-anchor="middle" class="small">0 °C</text><path d="M100 200 V127 Q100 65 162 65 H257 Q310 65 310 118 V225 H290 V118 Q290 85 257 85 H162 Q120 85 120 127 V200 H151 Q177 200 177 239 V264 Q177 290 151 290 H103 Q77 290 77 264 V239 Q77 211 100 200 Z" fill="#d9eff9"/><path d="M100 200 V127 Q100 65 162 65 H257 Q310 65 310 118 V280 A50 50 0 0 0 410 280 V65 M430 65 V280 A70 70 0 0 1 290 280 V118 Q290 85 257 85 H162 Q120 85 120 127 V200 H151 Q177 200 177 239 V264 Q177 290 151 290 H103 Q77 290 77 264 V239 Q77 211 100 200" class="wall"/><path d="M290 225 H310 V280 A50 50 0 0 0 410 280 V163 H430 V280 A70 70 0 0 1 290 280 Z" fill="#7d8d9f"/><line x1="290" y1="225" x2="310" y2="225" stroke="#263747" stroke-width="2"/><line x1="410" y1="163" x2="430" y2="163" stroke="#263747" stroke-width="2"/><text x="127" y="249" text-anchor="middle" class="small">Газ</text><text x="444" y="71" class="small">Открыто</text><line x1="275" y1="225" x2="490" y2="225" class="guide"/><line x1="436" y1="163" x2="490" y2="163" class="guide"/><line x1="481" y1="163" x2="481" y2="225" stroke="#263747" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="496" y="202" class="math">h<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan></text><text x="275" y="389" class="small">Уровень у метки неизменен</text><line x1="285" y1="363" x2="290" y2="238" stroke="#64748b" stroke-width="1.3"/><text x="510" y="286" class="math">p<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan>, V<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan></text></g><line x1="28" y1="425" x2="692" y2="425" stroke="#e2e8f0"/><g transform="translate(0 440)"><text x="28" y="34" class="heading">II. Нагретый газ</text><path d="M52 176 V348 H218 V176" fill="#fff0df" stroke="#64748b" stroke-width="2"/><text x="136" y="331" text-anchor="middle" class="small">100 °C</text><path d="M100 200 V127 Q100 65 162 65 H257 Q310 65 310 118 V225 H290 V118 Q290 85 257 85 H162 Q120 85 120 127 V200 H151 Q177 200 177 239 V264 Q177 290 151 290 H103 Q77 290 77 264 V239 Q77 211 100 200 Z" fill="#d9eff9"/><path d="M100 200 V127 Q100 65 162 65 H257 Q310 65 310 118 V280 A50 50 0 0 0 410 280 V65 M430 65 V280 A70 70 0 0 1 290 280 V118 Q290 85 257 85 H162 Q120 85 120 127 V200 H151 Q177 200 177 239 V264 Q177 290 151 290 H103 Q77 290 77 264 V239 Q77 211 100 200" class="wall"/><path d="M290 225 H310 V280 A50 50 0 0 0 410 280 V110 H430 V280 A70 70 0 0 1 290 280 Z" fill="#7d8d9f"/><line x1="290" y1="225" x2="310" y2="225" stroke="#263747" stroke-width="2"/><line x1="410" y1="110" x2="430" y2="110" stroke="#263747" stroke-width="2"/><text x="127" y="249" text-anchor="middle" class="small">Газ</text><text x="444" y="71" class="small">Открыто</text><line x1="275" y1="225" x2="490" y2="225" class="guide"/><line x1="436" y1="110" x2="490" y2="110" class="guide"/><line x1="481" y1="110" x2="481" y2="225" stroke="#263747" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="496" y="175.5" class="math">h<tspan baseline-shift="sub" font-size="70%" font-style="normal">100</tspan></text><text x="275" y="389" class="small">Уровень у метки неизменен</text><line x1="285" y1="363" x2="290" y2="238" stroke="#64748b" stroke-width="1.3"/><text x="510" y="286" class="math">p<tspan baseline-shift="sub" font-size="70%" font-style="normal">100</tspan>, V<tspan baseline-shift="sub" font-size="70%" font-style="normal">100</tspan></text></g><text x="360" y="893" text-anchor="middle" class="math">V<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan> = V<tspan baseline-shift="sub" font-size="70%" font-style="normal">100</tspan></text>
