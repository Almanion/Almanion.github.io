<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 575" role="img" aria-labelledby="title desc">
<title id="title">Таблица молярных теплоёмкостей</title><desc id="desc">По слайду: одноатомный газ i=3, двухатомный i=5, многоатомный i=6. cV=iR/2, cp=(i+2)R/2, gamma=1+2/i.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#263747" stroke-width="1.8"/></marker><marker id="route" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2366a4" stroke-width="2.5"/></marker><pattern id="shade" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#aac5db" stroke-width="1.2"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:27px}.small{font-size:21px}.heading{font-size:26px;font-weight:600}.wall{stroke:#263747;stroke-width:2.6;fill:none;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#263747;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.curve{stroke:#2366a4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#8193a5;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.pipe{stroke:#263747;stroke-width:8;fill:none;stroke-linejoin:round;stroke-linecap:round}.bore{stroke:#fff;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="700" height="575" rx="12" fill="#fff"/><text x="350" y="39" class="heading" text-anchor="middle">Молярные теплоёмкости</text><rect x="20" y="68" width="660" height="438" rx="0" fill="#fff" stroke="#263747" stroke-width="2.6"/><rect x="22" y="70" width="656" height="53" rx="0" fill="#edf5fa" stroke="none" stroke-width="2.6"/><path d="M181 68 L181 506" class="wall" /><path d="M232 68 L232 506" class="wall" /><path d="M396 68 L396 506" class="wall" /><path d="M560 68 L560 506" class="wall" /><path d="M20 124 L680 124" class="wall" /><path d="M20 224 L680 224" class="wall" /><path d="M20 324 L680 324" class="wall" /><path d="M20 424 L680 424" class="wall" /><text x="100" y="105" class="" text-anchor="middle">Газ</text><text x="206" y="105" class="math" text-anchor="middle">i</text><text x="314" y="105" class="math" text-anchor="middle">cᵥ</text><text x="478" y="105" class="math" text-anchor="middle">cₚ</text><text x="620" y="105" class="math" text-anchor="middle">γ</text><text x="100" y="181" class="small" text-anchor="middle">Одноатомный</text><text x="206" y="181" class="math" text-anchor="middle">3</text><text x="314" y="162" class="math" text-anchor="middle">3R/2</text><text x="314" y="197" class="small" text-anchor="middle">≈ 12,5</text><text x="478" y="162" class="math" text-anchor="middle">5R/2</text><text x="478" y="197" class="small" text-anchor="middle">≈ 20,8</text><text x="620" y="162" class="math" text-anchor="middle">5/3</text><text x="620" y="197" class="small" text-anchor="middle">≈ 1,7</text><text x="100" y="281" class="small" text-anchor="middle">Двухатомный</text><text x="206" y="281" class="math" text-anchor="middle">5</text><text x="314" y="262" class="math" text-anchor="middle">5R/2</text><text x="314" y="297" class="small" text-anchor="middle">≈ 20,8</text><text x="478" y="262" class="math" text-anchor="middle">7R/2</text><text x="478" y="297" class="small" text-anchor="middle">≈ 29,1</text><text x="620" y="262" class="math" text-anchor="middle">7/5</text><text x="620" y="297" class="small" text-anchor="middle">≈ 1,4</text><text x="100" y="381" class="small" text-anchor="middle">Многоатомный</text><text x="206" y="381" class="math" text-anchor="middle">6</text><text x="314" y="362" class="math" text-anchor="middle">3R</text><text x="314" y="397" class="small" text-anchor="middle">≈ 25</text><text x="478" y="362" class="math" text-anchor="middle">4R</text><text x="478" y="397" class="small" text-anchor="middle">≈ 33,2</text><text x="620" y="362" class="math" text-anchor="middle">4/3</text><text x="620" y="397" class="small" text-anchor="middle">≈ 1,3</text><text x="100" y="476" class="small" text-anchor="middle">Общая</text><text x="206" y="476" class="math" text-anchor="middle">i</text><text x="314" y="476" class="math" text-anchor="middle">iR/2</text><text x="478" y="476" class="math" text-anchor="middle">(i + 2)R/2</text><text x="620" y="476" class="math" text-anchor="middle">1 + 2/i</text><text x="350" y="547" class="small" text-anchor="middle">cᵥ, cₚ — в Дж/(моль · К); γ — безразмерный</text></svg>