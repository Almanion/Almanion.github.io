<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 585" role="img" aria-labelledby="title desc">
<title id="title">Две формулировки второго начала термодинамики</title><desc id="desc">Слева невозможен перенос теплоты от холодного тела к горячему без работы. Справа невозможен цикл, единственный результат которого — полное превращение теплоты одного тела в работу.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 4.5 L1.5 7.5" fill="none" stroke="#263747" stroke-width="1.7"/></marker><marker id="route" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#2366a4" stroke-width="1.8"/></marker><marker id="warm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#b54b38" stroke-width="1.8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}.small{font-size:21px}.heading{font-size:27px;font-weight:600}.wall{stroke:#263747;stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#263747;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.flow{stroke:#2366a4;stroke-width:2.4;fill:none;marker-end:url(#route)}.work{stroke:#263747;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.guide{stroke:#8193a5;stroke-width:1.3;stroke-dasharray:6 6;fill:none}.leader{stroke:#8193a5;stroke-width:1.3;fill:none}</style>
<rect width="880" height="585" rx="12" fill="#fff"/>
<text x="440" y="40" class="heading" text-anchor="middle" >Второе начало термодинамики</text>
<text x="220" y="88" class="" text-anchor="middle" >Формулировка Клаузиуса</text>
<text x="660" y="88" class="" text-anchor="middle" >Формулировка Томсона</text>
<path d="M440 105 V520" class="guide" />
<rect x="85" y="118" width="270" height="62" rx="8" fill="#fcf0e8" stroke="#263747" stroke-width="2"/>
<text x="220" y="157" class="" text-anchor="middle" >Горячее тело, T₁</text>
<circle cx="220" cy="292" r="55" fill="#fff" stroke="#263747" stroke-width="2.3"/>
<text x="220" y="286" class="" text-anchor="middle" >Цикл</text>
<text x="220" y="314" class="small" text-anchor="middle" >ΔU = 0</text>
<rect x="525" y="118" width="270" height="62" rx="8" fill="#fcf0e8" stroke="#263747" stroke-width="2"/>
<text x="660" y="157" class="" text-anchor="middle" >Горячее тело, T₁</text>
<circle cx="660" cy="292" r="55" fill="#fff" stroke="#263747" stroke-width="2.3"/>
<text x="660" y="286" class="" text-anchor="middle" >Цикл</text>
<text x="660" y="314" class="small" text-anchor="middle" >ΔU = 0</text>
<rect x="85" y="408" width="270" height="62" rx="8" fill="#e8f3fa" stroke="#263747" stroke-width="2"/>
<text x="220" y="447" class="" text-anchor="middle" >Холодное тело, T₂</text>
<path d="M220 408 V347" class="flow" />
<text x="247" y="387" class="math" text-anchor="start" >Q</text>
<path d="M220 237 V180" class="flow" />
<text x="247" y="219" class="math" text-anchor="start" >Q</text>
<text x="89" y="298" class="math" text-anchor="middle" >A = 0</text>
<path d="M660 180 V237" class="flow" />
<text x="686" y="218" class="math" text-anchor="start" >Q</text>
<path d="M715 292 H838" class="work" />
<text x="781" y="277" class="math" text-anchor="middle" >A′ = Q</text>
<text x="660" y="416" class="small" text-anchor="middle" >Других изменений нет</text>
<text x="220" y="510" class="small" text-anchor="middle" style="fill:#b54b38">× Невозможно без работы</text>
<text x="660" y="510" class="small" text-anchor="middle" style="fill:#b54b38">× Невозможно за полный цикл</text>
<text x="440" y="553" class="math" text-anchor="middle" >T₁ &gt; T₂</text>
</svg>
