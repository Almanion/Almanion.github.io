<title id="title">Три состояния газа в методе Клемана — Дезорма</title><desc id="desc">Переход 1-2 адиабатный: V увеличивается, p и T уменьшаются. Переход 2-3 вертикальный, изохорный: T возвращается к T0, p растёт. Состояния 1 и 3 лежат на одной вспомогательной изотерме. Шкала условная.</desc>
