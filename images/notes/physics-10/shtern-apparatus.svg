 </style><text x="28.000" y="42.000" class="heading" >Установка опыта Штерна</text><text x="28.000" y="78.000" class="stern-caption" >Продольный разрез</text><path d="M140 607V225Q140 135 235 135H485Q580 135 580 225V607Z" class="stern-glass" /><path d="M235 135V110H156" class="stern-wall" /><text x="60.000" y="117.000" class="stern-caption" >к насосу</text><text x="480.000" y="207.000" class="stern-caption" text-anchor="middle">вакуум</text><rect x="173" y="607" width="374" height="12" fill="#d8e4ed" rx="3"/><rect x="190" y="248" width="8" height="288" fill="#dce6ee" stroke="#263747" stroke-width="2" id="stern-apparatus-outer-left"/><rect x="522" y="248" width="8" height="288" fill="#dce6ee" stroke="#263747" stroke-width="2" id="stern-apparatus-outer-right"/><line x1="194.000" y1="248.000" x2="350.000" y2="248.000" class="stern-wall" /><line x1="370.000" y1="248.000" x2="526.000" y2="248.000" class="stern-wall" /><line x1="194.000" y1="536.000" x2="350.000" y2="536.000" class="stern-wall" /><line x1="370.000" y1="536.000" x2="526.000" y2="536.000" class="stern-wall" /><rect x="286" y="280" width="8" height="214" fill="#dce6ee" stroke="#263747" stroke-width="2"/><rect x="426" y="280" width="8" height="51" fill="#dce6ee" stroke="#263747" stroke-width="2"/><rect x="426" y="405" width="8" height="89" fill="#dce6ee" stroke="#263747" stroke-width="2"/><line x1="290.000" y1="280.000" x2="350.000" y2="280.000" class="stern-wall" /><line x1="370.000" y1="280.000" x2="430.000" y2="280.000" class="stern-wall" /><line x1="290.000" y1="494.000" x2="350.000" y2="494.000" class="stern-wall" /><line x1="370.000" y1="494.000" x2="430.000" y2="494.000" class="stern-wall" /><rect x="419" y="332" width="22" height="72" fill="#c6e9e5" opacity=".55" id="stern-apparatus-slit"/><line x1="360.000" y1="223.000" x2="360.000" y2="298.000" class="stern-wall" /><line x1="360.000" y1="298.000" x2="360.000" y2="472.000" class="stern-wall" style="stroke:#b85032;stroke-width:4" id="stern-apparatus-w