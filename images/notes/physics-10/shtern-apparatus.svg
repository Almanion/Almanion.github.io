 .stern-dimension{fill:none;stroke:#8455a5;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
 .stern-turn{fill:none;stroke:#176da3;stroke-width:3;marker-end:url(#arrow)}.stern-guide{fill:none;stroke:#8291a2;stroke-width:1.5;stroke-dasharray:6 6}
