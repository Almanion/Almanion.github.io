<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 812" role="img" aria-labelledby="title desc">
<title id="title">Опыт Штерна</title><desc id="desc">Схематический разрез установки под стеклянным колпаком: внутри расположены два цилиндра с общей осью. Молекулы проходят через щель и оставляют след. Нумерация сохранена по тетради; заполненная подпись имеется только для номера 1.</desc>
