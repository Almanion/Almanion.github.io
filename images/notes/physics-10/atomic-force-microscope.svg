<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">Схема атомно-силового микроскопа</title><desc id="desc">Лазерный луч падает на кантилевер и отражается из той же точки на фотодиод. Зонд взаимодействует с образцом. Сигнал фотодиода поступает в систему обратной связи, которая управляет пьезосканером под образцом.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#263747" stroke-width="1.5"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#b85032" stroke-width="2"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263747}.heading{font-size:26px;font-weight:600}.label{font-size:24px}.small{font-size:22px}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:27px}.wall{fill:none;stroke:#263747;stroke-width:2.5;stroke-linejoin:round}.leader{fill:none;stroke:#8291a2;stroke-width:1.5}.guide{fill:none;stroke:#8291a2;stroke-width:1.5;stroke-dasharray:6 6}.axis{fill:none;stroke:#263747;stroke-width:1.8;marker-end:url(#arrow)}.dimension{fill:none;stroke:#8455a5;stroke-width:1.8;marker-start:url(#arrow);marker-end:url(#arrow)}.ray{fill:none;stroke:#b85032;stroke-width:3;marker-end:url(#red-arrow)}.signal{fill:none;stroke:#176da3;stroke-width:2;marker-end:url(#arrow)}.beam{fill:none;stroke:#087f80;stroke-width:2.8;stroke-linejoin:round}</style>
<rect width="720" height="620" rx="12" fill="#fff"/><text x="28.000" y="40.000" class="heading" >Атомно-силовой микроскоп</text><rect x="185" y="103" width="96" height="45" fill="#e2f2ef" rx="8" stroke="#087f80" stroke-width="2.5" id="afm-photodiode"/><line x1="233.000" y1="105.000" x2="233.000" y2="146.000" class="wall" style="stroke:#087f80;stroke-width:1.4"/><text x="233.000" y="87.000" class="small" text-anchor="middle">Фотодиод</text><rect x="530" y="94" width="98" height="54" fill="#e2f2ef" rx="8" stroke="#087f80" stroke-width="2.5"/><text x="579.000" y="130.000" class="small" text-anchor="middle">Лазер</text><rect x="50" y="217" width="180" height="76" fill="#f4f8fc" rx="9" stroke="#7fa8bf" stroke-width="2"/><text x="140.000" y="245.000" class="small" text-anchor="middle">Обратная</text><text x="140.000" y="275.000" class="small" text-anchor="middle">связь</text><path d="M185 126H140V217" class="signal" /><path d="M140 293V489H335" class="signal" id="afm-feedback-to-scanner"/><rect x="245" y="287" width="19" height="76" fill="#dce6ee" stroke="#263747" stroke-width="2"/><rect x="264" y="310" width="160" height="12" fill="#dce6ee" stroke="#263747" stroke-width="2" id="afm-cantilever"/><path d="M377 322H413L395 414Z" class="wall" style="fill:#176da3" id="afm-probe"/><path d="M250 426L300 415L335 425L375 410L415 420L460 413L500 430V465H250Z" class="wall" style="fill:#fdf3df;stroke:#cc9a35" id="afm-sample"/><rect x="250" y="465" width="250" height="8" fill="#dce6ee" /><rect x="335" y="473" width="120" height="32" fill="#e2f2ef" rx="5" stroke="#087f80" stroke-width="2" id="afm-scanner"/><line x1="395.000" y1="218.000" x2="395.000" y2="308.000" class="guide" /><line x1="557.000" y1="148.000" x2="395.000" y2="310.000" class="ray" id="afm-incident-ray"/><line x1="395.000" y1="310.000" x2="233.000" y2="148.000" class="ray" id="afm-reflected-ray"/><circle cx="395.000" cy="310.000" r="3" fill="#b85032" /><text x="278.000" y="268.000" class="small" >Кантилевер</text><line x1="327.000" y1="276.000" x2="350.000" y2="310.000" class="leader" /><text x="448.000" y="366.000" class="small" >Зонд</text><line x1="439.000" y1="356.000" x2="405.000" y2="345.000" class="leader" /><text x="538.000" y="452.000" class="small" >Образец</text><line x1="523.000" y1="445.000" x2="495.000" y2="434.000" class="leader" /><text x="395.000" y="537.000" class="small" text-anchor="middle">Пьезосканер</text><text x="360.000" y="596.000" class="small" text-anchor="middle">Сканер перемещает образец по сигналу фотодиода</text>
</svg>
