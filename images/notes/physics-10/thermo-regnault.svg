372 700 372 H587 Q570 372 570 387 Q570 402 587 402 H796" class="pipe" /><path d="M587 222 H700 Q716 222 716 237 Q716 252 700 252 H587 Q570 252 570 267 Q570 282 587 282 H700 Q716 282 716 297 Q716 312 700 312 H587 Q570 312 570 327 Q570 342 587 342 H700 Q716 342 716 357 Q716 372 700 372 H587 Q570 372 570 387 Q570 402 587 402 H796" class="bore" /><path d="M760 402 L786 402" class="curve" marker-end="url(#route)"/><path d="M736 291 V147 Q742 138 748 147 V291 A10 10 0 1 1 736 291 Z" class="wall" /><path d="M742 282 L742 180" class="wall" /><text x="763" y="166" class="math" text-anchor="start">T</text><rect x="796" y="284" width="225" height="194" rx="0" fill="#e5f3fa" stroke="#263747" stroke-width="2.6"/><path d="M796 318 L1021 318" class="guide" /><path d="M796 402 H965 Q984 402 984 415 Q984 428 965 428 H837 Q821 428 821 441 Q821 454 837 454 H985 V267 H1039" class="pipe" /><path d="M796 402 H965 Q984 402 984 415 Q984 428 965 428 H837 Q821 428 821 441 Q821 454 837 454 H985 V267 H1039" class="bore" /><path d="M1000 267 L1035 267" class="curve" marker-end="url(#route)"/><path d="M819 384 V233 Q825 224 831 233 V384 A10 10 0 1 1 819 384 Z" class="wall" /><path d="M825 375 L825 270" class="wall" /><path d="M946 244 L946 364" class="wall" /><path d="M929 354 Q946 343 963 354" class="wall" /><text x="939" y="214" class="small" text-anchor="middle">Мешалка</text><text x="910" y="520" class="small" text-anchor="middle">Калориметр</text><text x="914" y="555" class="small" text-anchor="middle">Вода: T₁ → T₂</text><text x="995" y="247" class="small" text-anchor="middle">Выход</text><text x="250" y="480" class="small" text-anchor="middle">Постоянные Vₐ, Tₐ</text><text x="530" y="599" class="small" text-anchor="middle">Поток газа: A → H → горячая ванна → калориметр → наружу</text></svg>