<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">Установка метода Реньо</title><desc id="desc">Основной газовый канал непрерывен: из сосуда A через кран H, погружённый змеевик нагревателя B, затем погружённый змеевик водяного калориметра к выходу. Витки не пересекаются и не образуют обхода. M2 присоединён к A, M1 — после H; свободные колена открыты в атмосферу. Термометры погружены в жидкость и не соединены с газовыми трубками.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#263747" stroke-width="1.8"/></marker><marker id="route" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L6 3.5 L1.5 5.5" fill="none" stroke="#2366a4" stroke-width="1.4"/></marker><pattern id="shade" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#aac5db" stroke-width="1.2"/></pattern></defs>
