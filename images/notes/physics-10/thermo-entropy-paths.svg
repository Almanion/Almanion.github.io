<path d="M281.463 157.057 L286.559 155.297 L291.695 153.595 L296.869 151.950 L302.079 150.362 L307.325 148.830 L312.605 147.354 L317.918 145.934 L323.262 144.570 L328.636 143.260 L334.040 142.004 L339.471 140.803 L344.928 139.655 L350.410 138.560 L355.916 137.518 L361.445 136.529 L366.994 135.591 L372.563 134.705 L378.151 133.870" class="flow actual" />
<path d="M493.330 330.616 L488.407 332.569 L483.440 334.461 L478.430 336.293 L473.379 338.064 L468.287 339.776 L463.156 341.427 L457.987 343.018 L452.780 344.549 L447.538 346.021 L442.260 347.433 L436.948 348.786 L431.604 350.079 L426.227 351.314 L420.820 352.490 L415.384 353.607 L409.919 354.666 L404.426 355.666 L398.908 356.608" class="flow" />
<circle cx="105.0" cy="330.0" r="4.5" fill="#263747"/>
<circle cx="660.0" cy="150.0" r="4.5" fill="#263747"/>
<text x="82" y="359" class="math" text-anchor="middle">1</text>
<text x="686" y="151" class="math" text-anchor="middle">2</text>
<text x="365" y="96" class="" text-anchor="middle">I: 1 → 2</text>
<text x="405" y="410" class="" text-anchor="middle">II: 2 → 1</text>
