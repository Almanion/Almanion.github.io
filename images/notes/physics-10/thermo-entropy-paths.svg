<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="title desc">
<title id="title">Необратимый переход и вспомогательный обратимый возврат</title><desc id="desc">Условная схема без координатных осей. Пунктирный действительный необратимый путь I направлен из равновесного состояния 1 в состояние 2; он не изображает последовательность равновесных состояний. Сплошной вспомогательный обратимый путь II направлен из состояния 2 назад в состояние 1. Оба пути составляют замкнутый цикл.</desc>
<defs><marker id="flow-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 4.5 L1.5 7.5" fill="none" stroke="#2366a4" stroke-width="1.7"/></marker><marker id="work-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 4.5 L1.5 7.5" fill="none" stroke="#263747" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.heading{font-size:27px;font-weight:600}.subheading{font-size:24px;font-weight:600}.small{font-size:21px}.device{font-size:21px}.math{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-style:italic}.flow{fill:none;stroke:#2366a4;stroke-width:2.4;stroke-linecap:round;marker-end:url(#flow-arrow)}.work{fill:none;stroke:#263747;stroke-width:2.2;stroke-linecap:round;marker-end:url(#work-arrow)}.dash{fill:none;stroke:#8193a5;stroke-width:1.3;stroke-dasharray:6 6}.path{fill:none;stroke:#2366a4;stroke-width:2.8;stroke-linecap:round}.actual{stroke-dasharray:8 7}.guide{fill:none;stroke:#8193a5;stroke-width:1.3}</style>
<rect width="780" height="530" rx="12" fill="#fff"/>
<text x="390" y="39" class="heading" text-anchor="middle">Необратимый переход и обратимый возврат</text>
<path d="M105.0 330.0 C160.0 120.0 470.0 100.0 660.0 150.0" class="path actual" />
