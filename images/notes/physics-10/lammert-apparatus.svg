<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 952" role="img" aria-labelledby="title desc">
<title id="title">Установка опыта Ламмерта</title><desc id="desc">Толстостенный сосуд 1 содержит молекулярную печь 2, диафрагму 3, диски 4 и 5 с узкими прорезями и стеклянную мишень 8. Мотор 6 вращает диски на общем валу. Ловушка 7 находится в охлаждаемой части линии насоса 9. Внизу показан относительный поворот прорезей двух дисков.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#263747" stroke-width="1.7"/></marker></defs>
