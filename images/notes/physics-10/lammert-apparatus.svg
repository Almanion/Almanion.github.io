<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Установка опыта Ламмерта</title><desc id="desc">В вакуумном сосуде 1 находятся молекулярная печь 2, диафрагма 3, диски 4 и 5 на общем валу и стеклянная мишень 8. Мотор 6 вращает диски. Расстояние между дисками — ℓ, угол смещения их прорезей — α. Молекула проходит диски последовательно: вторая прорезь должна повернуться к пучку за время пролёта. Нижняя линия откачки и отдельные нижние рисунки отсутствуют.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#263747" stroke-width="1.7"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263747}.label{font-size:24px}.small{font-size:22px}.heading{font-size:26px;font-weight:600}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}.number{font-size:21px}.wall{fill:none;stroke:#263747;stroke-width:2.3;stroke-linejoin:round}.leader{fill:none;stroke:#8291a2;stroke-width:1.3}.guide{fill:none;stroke:#8291a2;stroke-width:1.3;stroke-dasharray:6 6}.axis{fill:none;stroke:#263747;stroke-width:1.7;marker-end:url(#arrow)}.beam{fill:none;stroke:#087f80;stroke-width:2.5;stroke-dasharray:7 5}.rotation{fill:none;stroke:#263747;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="720" height="480" rx="12" fill="#fff"/>
<defs>
  <marker id="stern-arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f80"/></marker>
  <marker id="stern-arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8455a5"/></marker>
 </defs><style>
 .stern-wall{fill:none;stroke:#263747;stroke-width:3;stroke-linejoin:round}.stern-glass{fill:#edf7fc;fill-opacity:.6;stroke:#7fa8bf;stroke-width:3}
 .stern-leader{fill:none;stroke:#8291a2;stroke-width:1.5;stroke-linejoin:round}.stern-point{fill:#8291a2}
 .stern-beam{fill:none;stroke:#087f80;stroke-width:3;marker-end:url(#stern-arrow-teal)}
 .stern-dimension{fill:none;stroke:#8455a5;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
 .stern-turn{fill:none;stroke:#176da3;stroke-width:3;marker-end:url(#arrow)}.stern-guide{fill:none;stroke:#8291a2;stroke-width:1.5;stroke-dasharray:6 6}
 .stern-caption{font-size:22px;fill:#526a7e}.stern-teal{fill:#087f80}.stern-purple{fill:#8455a5}.stern-blue{fill:#176da3}
 </style><text x="28.000" y="40.000" class="heading" >Установка опыта Ламмерта</text><text x="28.000" y="78.000" class="stern-caption" >Пучок проходит прорези двух вращающихся дисков</text><rect x="36" y="135" width="592" height="292" fill="#fbfdff" rx="16" stroke="#263747" stroke-width="3.2" id="lammert-chamber"/><text x="62.000" y="170.000" class="stern-caption" >вакуум</text><rect x="104" y="204" width="86" height="110" fill="#f7eee9" rx="8" stroke="#263747" stroke-width="2.5"/><rect x="190" y="238" width="25" height="20" fill="#fff" stroke="#263747" stroke-width="2"/><rect x="119" y="287" width="55" height="10" fill="#8291a2" rx="4"/><path d="M120 274q7-8 14 0t14 0t14 0" class="wall" style="stroke:#b85032;stroke-width:2"/><rect x="248" y="202" width="9" height="36" fill="#263747" /><rect x="248" y="258" width="9" height="57" fill="#263747" /><line x1="215.000" y1="248.000" x2="337.000" y2="248.000" class="stern-beam" id="lammert-incoming-beam"/><line x1="354.000" y1="248.000" x2="565.000" y2="248.000" class="stern-guide" id="lammert-flight-direction"/><ellipse cx="348" cy="305" rx="29" ry="100" fill="#e5ebf2" stroke="#263747" stroke-width="2.3" id="lammert-disk-4"/><line x1="348.000" y1="286.000" x2="348.000" y2="205.000" class="wall" style="stroke:#fff;stroke-width:7" id="lammert-slot-4"/><ellipse cx="348" cy="305" rx="7" ry="12" fill="#fff" stroke="#263747" stroke-width="1.5"/><ellipse cx="439" cy="305" rx="29" ry="100" fill="#e5ebf2" stroke="#263747" stroke-width="2.3" id="lammert-disk-5"/><line x1="441.544" y1="288.147" x2="452.392" y2="216.301" class="wall" style="stroke:#fff;stroke-width:7" id="lammert-slot-5"/><ellipse cx="439" cy="305" rx="7" ry="12" fill="#fff" stroke="#263747" stroke-width="1.5"/><line x1="329.000" y1="305.000" x2="654.000" y2="305.000" class="wall" style="stroke-width:4" id="lammert-common-shaft"/><rect x="620" y="295" width="16" height="20" fill="#fff" stroke="#263747" stroke-width="2"/><rect x="654" y="280" width="46" height="50" fill="#e5ebf2" rx="6" stroke="#263747" stroke-width="2.3"/><line x1="345.000" y1="248.000" x2="351.000" y2="248.000" class="wall" style="stroke:#087f80;stroke-width:3"/><rect x="567" y="217" width="10" height="62" fill="#d6e9f4" stroke="#263747" stroke-width="2"/><rect x="566" y="238" width="5" height="20" fill="#b85032" rx="2"/><line x1="348.000" y1="183.000" x2="439.000" y2="183.000" class="stern-dimension" id="lammert-separation"/><line x1="348.000" y1="192.000" x2="348.000" y2="205.000" class="stern-guide" /><line x1="439.000" y1="192.000" x2="439.000" y2="205.000" class="stern-guide" /><text x="394.000" y="171.000" class="math stern-purple" text-anchor="middle">ℓ</text><line x1="439.000" y1="305.000" x2="439.000" y2="201.000" class="stern-guide" /><path d="M439 246 A17.11 59 0 0 1 446.901 252.667" class="wall" style="stroke:#8455a5;stroke-width:2" id="lammert-slot-angle"/><text x="468.000" y="268.000" class="math stern-purple" >α</text><path d="M465 245Q468 208 443 193" class="stern-turn" /><text x="478.000" y="216.000" class="math stern-blue" >ω</text><polyline points="103.000,117.000 131.000,117.000 144.000,135.000" class="stern-leader"/><circle cx="144.000" cy="135.000" r="3" fill="#8291a2" /><circle cx="86.000" cy="117.000" r="17" fill="#fff" stroke="#176da3" stroke-width="1.5"/><text x="86.000" y="124.000" class="number stern-blue" text-anchor="middle">1</text><polyline points="125.000,348.000 148.000,348.000 148.000,313.000" class="stern-leader"/><circle cx="148.000" cy="313.000" r="3" fill="#8291a2" /><circle cx="108.000" cy="348.000" r="17" fill="#fff" stroke="#176da3" stroke-width="1.5"/><text x="108.000" y="355.000" class="number stern-blue" text-anchor="middle">2</text><polyline points="252.000,134.000 252.000,202.000" class="stern-leader"/><circle cx="252.000" cy="202.000" r="3" fill="#8291a2" /><circle cx="252.000" cy="117.000" r="17" fill="#fff" stroke="#176da3" stroke-width="1.5"/><text x="252.000" y="124.000" class="number stern-blue" text-anchor="middle">3</text><polyline points="326.000,134.000 339.000,154.000 348.000,205.000" class="stern-leader"/><circle cx="348.000" cy="205.000" r="3" fill="#8291a2" /><circle cx="326.000" cy="117.000" r="17" fill="#fff" stroke="#176da3" stroke-width="1.5"/><text x="326.000" y="124.000" class="number stern-blue" text-anchor="middle">4</text><polyline points="438.000,134.000 462.000,152.000 452.000,216.000" class="stern-leader"/><circle cx="452.000" cy="216.000" r="3" fill="#8291a2" /><circle cx="438.000" cy="117.000" r="17" fill="#fff" stroke="#176da3" stroke-width="1.5"/><text x="438.000" y="124.000" class="number stern-blue" text-anchor="middle">5</text><polyline points="672.000,349.000 677.000,330.000" class="stern-leader"/><circle cx="677.000" cy="330.000" r="3" fill="#8291a2" /><circle cx="672.000" cy="366.000" r="17" fill="#fff" stroke="#176da3" stroke-width="1.5"/><text x="672.000" y="373.000" class="number stern-blue" text-anchor="middle">6</text><polyline points="576.000,134.000 584.000,171.000 572.000,217.000" class="stern-leader"/><circle cx="572.000" cy="217.000" r="3" fill="#8291a2" /><circle cx="576.000" cy="117.000" r="17" fill="#fff" stroke="#176da3" stroke-width="1.5"/><text x="576.000" y="124.000" class="number stern-blue" text-anchor="middle">8</text><text x="360.000" y="451.000" class="stern-caption" text-anchor="middle">Прорези дисков 4 и 5 смещены на угол α</text>
</svg>
