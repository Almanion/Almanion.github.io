<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 397" role="img" aria-labelledby="title desc">
<title id="title">Изотермы Ван-дер-Ваальса</title>
<desc id="desc">Рядом с вертикальной асимптотой V=b кривые резко возрастают. У изотерм T₃ и T₂ есть минимум и максимум. На критической изотерме они сливаются в точке K, при T₁ изотерма монотонна.</desc>

