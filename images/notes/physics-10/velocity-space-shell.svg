<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
<title id="title">Шаровой слой в пространстве скоростей</title><desc id="desc">Центральное сечение трёхмерного шарового слоя в плоскости vz равно нулю. Внутренний радиус — v, внешний — v плюс дельта v. Все направления скоростей одного модуля входят в сферу. Показана ширина слоя дельта v; для подсчёта молекул используется объём всего трёхмерного слоя.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#263747" stroke-width="1.5"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#b85032" stroke-width="2"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263747}.heading{font-size:26px;font-weight:600}.label{font-size:24px}.small{font-size:22px}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:27px}.wall{fill:none;stroke:#263747;stroke-width:2.5;stroke-linejoin:round}.leader{fill:none;stroke:#8291a2;stroke-width:1.5}.guide{fill:none;stroke:#8291a2;stroke-width:1.5;stroke-dasharray:6 6}.axis{fill:none;stroke:#263747;stroke-width:1.8;marker-end:url(#arrow)}.dimension{fill:none;stroke:#8455a5;stroke-width:1.8;marker-start:url(#arrow);marker-end:url(#arrow)}.ray{fill:none;stroke:#b85032;stroke-width:3;marker-end:url(#red-arrow)}.signal{fill:none;stroke:#176da3;stroke-width:2;marker-end:url(#arrow)}.beam{fill:none;stroke:#087f80;stroke-width:2.8;stroke-linejoin:round}</style>
<rect width="720" height="650" rx="12" fill="#fff"/><text x="28.000" y="40.000" class="heading" >Переход к модулю скорости</text><text x="28.000" y="78.000" class="small" >Центральное сечение шарового слоя</text><circle cx="355.000" cy="326.000" r="196" fill="#e3f2fa" stroke="#176da3" stroke-width="2.5" id="velocity-shell-outer"/><circle cx="355.000" cy="326.000" r="180" fill="#fff" stroke="#176da3" stroke-width="2.5" id="velocity-shell-inner"/><line x1="95.000" y1="326.000" x2="640.000" y2="326.000" class="axis" /><line x1="355.000" y1="565.000" x2="355.000" y2="105.000" class="axis" /><text x="653.000" y="338.000" class="math" >vₓ</text><text x="340.000" y="114.000" class="math" text-anchor="end">vᵧ</text><text x="331.000" y="357.000" class="math" >O</text><line x1="355.000" y1="326.000" x2="508.454" y2="231.916" class="axis" style="stroke:#8455a5" id="velocity-shell-radius-inner"/><text x="442.000" y="280.000" class="math" style="fill:#8455a5">v</text><line x1="355.000" y1="326.000" x2="443.905" y2="151.323" class="guide" style="stroke:#8455a5" id="velocity-shell-radius-outer"/><text x="460.905" y="141.323" class="math" style="fill:#8455a5">v + Δv</text><line x1="535.000" y1="326.000" x2="535.000" y2="365.000" class="guide" /><line x1="551.000" y1="326.000" x2="551.000" y2="365.000" class="guide" /><line x1="535.000" y1="365.000" x2="551.000" y2="365.000" class="dimension" id="velocity-shell-width"/><line x1="551.000" y1="365.000" x2="567.000" y2="393.000" class="leader" /><text x="570.000" y="415.000" class="math" >Δv</text><text x="28.000" y="578.000" class="small" >Сечение в плоскости v<tspan baseline-shift="sub" font-size="70%">z</tspan> = 0</text><text x="360.000" y="623.000" class="small" text-anchor="middle">Объём тонкого слоя: ΔV ≈ 4πv²Δv</text>
</svg>
