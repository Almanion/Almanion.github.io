<title id="title">Цикл Карно на диаграмме давления и объёма</title><desc id="desc">Точные кривые идеального газа: 1-2 изотермическое расширение при температуре нагревателя, 2-3 адиабатное расширение, 3-4 изотермическое сжатие при температуре холодильника, 4-1 адиабатное сжатие. Цикл по часовой стрелке; температура нагревателя выше температуры холодильника.</desc>
