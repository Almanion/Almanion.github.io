<title id="title">Графики изобарного процесса</title><desc id="desc">При постоянном давлении графики p(V) и p(T) горизонтальны. График V(T) — прямая через начало координат. При одинаковом количестве газа большему давлению соответствует меньший наклон изобары V(T).</desc>
