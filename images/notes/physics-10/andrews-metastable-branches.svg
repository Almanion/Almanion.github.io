<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594 412" role="img" aria-labelledby="title desc">
<title id="title">Изотермы Эндрюса и Ван-дер-Ваальса при одной температуре</title>
<desc id="desc">Между C и B сплошная изотерма идёт горизонтально, а расчётная проходит через минимум C₁ и максимум B₁. Слева от C и справа от B остаются однофазные ветви.</desc>

