<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1005" role="img" aria-labelledby="title desc">
<title id="title">Связь термодинамических параметров</title><desc id="desc">Вверху показан переход между двумя состояниями. Внизу тот же переход выполнен через промежуточное состояние: сначала изобарное расширение 1 — штрих, затем изотермическое сжатие штрих — 2 вдоль верхней гиперболы. Все три точки точно лежат на соответствующих изотермах.</desc>
