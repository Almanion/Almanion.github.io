<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Связь термодинамических параметров</title>
  <desc id="desc">На диаграмме давления от объёма переход из состояния один в состояние два проходит через промежуточное состояние.</desc>
  <defs>
    <style>
      .frame{fill:#fbfdff;stroke:#d6e1ed;stroke-width:2}.axis{stroke:#173f70;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .t1{stroke:#0b8f87;stroke-width:5;fill:none}.t2{stroke:#754fa8;stroke-width:5;fill:none}.path{stroke:#d4674c;stroke-width:4;fill:none;marker-end:url(#pathArrow)}
      .guide{stroke:#8298ad;stroke-width:2;stroke-dasharray:8 7}.point{fill:#173f70}.heading{font:700 28px system-ui,sans-serif;fill:#173f70}.label{font:21px system-ui,sans-serif;fill:#173f70}.small{font:17px system-ui,sans-serif;fill:#526b84}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#173f70"/></marker>
    <marker id="pathArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4674c"/></marker>
  </defs>
  <rect class="frame" x="20" y="20" width="920" height="580" rx="22"/>
  <text class="heading" x="480" y="66" text-anchor="middle">Связь термодинамических параметров</text>
  <path class="axis" d="M125 510H850"/><path class="axis" d="M125 510V112"/><text class="label" x="858" y="529">V</text><text class="label" x="99" y="116">p</text>
  <path class="t2" d="M185 145C225 215 308 300 455 354C562 393 698 417 817 430"/>
  <path class="t1" d="M185 224C240 296 338 367 496 411C609 443 720 459 817 467"/>
  <text class="label" x="802" y="411">T₂ = const</text><text class="label" x="802" y="485">T₁ = const</text>
  <line class="guide" x1="125" y1="395" x2="680" y2="395"/><line class="guide" x1="125" y1="300" x2="392" y2="300"/>
  <line class="guide" x1="265" y1="395" x2="265" y2="510"/><line class="guide" x1="392" y1="300" x2="392" y2="510"/><line class="guide" x1="680" y1="395" x2="680" y2="510"/>
  <circle class="point" cx="265" cy="395" r="8"/><circle class="point" cx="392" cy="300" r="8"/><circle class="point" cx="680" cy="395" r="8"/>
  <text class="label" x="241" y="387">1</text><text class="label" x="402" y="290">2</text><text class="label" x="692" y="388">′</text>
  <text class="small" x="105" y="402">p₁ = p′</text><text class="small" x="105" y="307">p₂</text><text class="small" x="265" y="540" text-anchor="middle">V₁</text><text class="small" x="392" y="540" text-anchor="middle">V₂</text><text class="small" x="680" y="540" text-anchor="middle">V′</text>
  <path class="path" d="M265 395H665"/><path class="path" d="M669 390C598 368 493 335 404 305"/>
</svg>
