<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">Прямоугольный газовый цикл</title><desc id="desc">Цикл 1–2–3–4–1 идёт по часовой стрелке. Состояния в координатах V,p: 1=(V0,p0), 2=(V0,2p0), 3=(2V0,2p0), 4=(2V0,p0). Направления стрелок соответствуют порядку состояний.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 4.5 L1.5 7.5" fill="none" stroke="#263747" stroke-width="1.6"/></marker><marker id="route" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5.5 L2 9" fill="none" stroke="#2366a4" stroke-width="1.9"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:23px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-size:29px;font-style:italic}.small{font-size:21px}.heading{font-size:28px;font-weight:600}.curve{fill:none;stroke:#2366a4;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.axis{fill:none;stroke:#263747;stroke-width:1.8;marker-end:url(#arrow)}.guide{fill:none;stroke:#8297aa;stroke-width:1.3;stroke-dasharray:5 6}.leader{fill:none;stroke:#526a80;stroke-width:1.4;stroke-linecap:round}.dot{fill:#263747}.label5{fill:#257245}.label4{fill:#b65c12}</style>
<rect width="1000" height="720" rx="12" fill="#fff"/>
<text x="500" y="43" class="heading" text-anchor="middle">Прямоугольный газовый цикл</text>
<path d="M90 600 H930" class="axis" />
<path d="M90 600 V90" class="axis" />
<text x="945" y="615" class="math" text-anchor="middle">V</text>
<text x="69" y="90" class="math" text-anchor="middle">p</text>
<text x="72" y="627" class="math" text-anchor="middle">0</text>
<path d="M90 180 H690 V600 M90 390 H690 M390 180 V600" class="guide" />
<text x="71" y="398" class="math" text-anchor="end">p₀</text>
<text x="71" y="188" class="math" text-anchor="end">2p₀</text>
<text x="390" y="640" class="math" text-anchor="middle">V₀</text>
<text x="690" y="640" class="math" text-anchor="middle">2V₀</text>
<path d="M390 390 V180 H690 V390 Z" class="curve" />
<path d="M390 330 V262" class="curve" marker-end="url(#route)"/>
<path d="M470 180 H558" class="curve" marker-end="url(#route)"/>
<path d="M690 242 V322" class="curve" marker-end="url(#route)"/>
<path d="M594 390 H499" class="curve" marker-end="url(#route)"/>
<circle cx="390" cy="390" r="4.5" class="dot"/>
<text x="371" y="418" class="math" text-anchor="middle">1</text>
<circle cx="390" cy="180" r="4.5" class="dot"/>
<text x="371" y="166" class="math" text-anchor="middle">2</text>
<circle cx="690" cy="180" r="4.5" class="dot"/>
<text x="710" y="166" class="math" text-anchor="middle">3</text>
<circle cx="690" cy="390" r="4.5" class="dot"/>
<text x="710" y="418" class="math" text-anchor="middle">4</text>
<text x="500" y="689" class="small" text-anchor="middle">1 → 2 и 3 → 4 — изохоры. 2 → 3 и 4 → 1 — изобары.</text>
</svg>
