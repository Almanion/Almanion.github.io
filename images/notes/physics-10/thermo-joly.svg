<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
<title id="title">Метод Жоли</title><desc id="desc">Две одинаковые сферы подвешены к весам внутри калориметра; одна содержит газ, другая оставлена пустой.</desc>
