<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 605" role="img" aria-labelledby="title desc">
<title id="title">Калориметр Жоли</title><desc id="desc">Две одинаковые герметичные сферы с чашечками подвешены к весам. В левой газ, правая откачана. Пар нагревает обе; дополнительный конденсат слева связан с нагревом газа.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#263747" stroke-width="1.8"/></marker><marker id="route" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2366a4" stroke-width="2.5"/></marker><pattern id="shade" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#aac5db" stroke-width="1.2"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:27px}.small{font-size:21px}.heading{font-size:26px;font-weight:600}.wall{stroke:#263747;stroke-width:2.6;fill:none;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#263747;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.curve{stroke:#2366a4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#8193a5;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.pipe{stroke:#263747;stroke-width:8;fill:none;stroke-linejoin:round;stroke-linecap:round}.bore{stroke:#fff;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="720" height="605" rx="12" fill="#fff"/><text x="360" y="43" class="heading" text-anchor="middle">Метод Жоли</text><rect x="60" y="213" width="600" height="320" rx="0" fill="#f4f8fb" stroke="none" stroke-width="2.6"/><path d="M60 213 V533 H660 V213" class="wall" /><path d="M60 213 L660 213" class="wall" /><path d="M360 91 L360 149" class="wall" /><circle cx="360" cy="149" r="6" fill="#263747"/><path d="M145 149 L575 149" class="wall" /><text x="360" y="80" class="small" text-anchor="middle">Весы</text><path d="M210 149 L210 286" class="wall" /><circle cx="210" cy="333" r="47" fill="#fff" stroke="#263747" stroke-width="2.6"/><path d="M149 379 V424 H271 V379" class="wall" /><path d="M210 380 L210 424" class="wall" /><path d="M165 413 L255 413" class="guide" /><path d="M175 373 Q180 384 175 392" class="curve" /><path d="M245 373 Q250 384 245 392" class="curve" /><path d="M510 149 L510 286" class="wall" /><circle cx="510" cy="333" r="47" fill="#fff" stroke="#263747" stroke-width="2.6"/><path d="M449 379 V424 H571 V379" class="wall" /><path d="M510 380 L510 424" class="wall" /><path d="M465 413 L555 413" class="guide" /><path d="M475 373 Q480 384 475 392" class="curve" /><path d="M545 373 Q550 384 545 392" class="curve" /><circle cx="193" cy="326" r="3" fill="#2366a4"/><circle cx="223" cy="337" r="3" fill="#2366a4"/><circle cx="208" cy="350" r="3" fill="#2366a4"/><text x="135" y="270" class="small" text-anchor="start">Газ</text><path d="M154 278 L184 294" class="guide" /><text x="535" y="270" class="small" text-anchor="start">Воздух откачан</text><path d="M559 278 L541 295" class="guide" /><text x="360" y="476" class="small" text-anchor="middle">Чашечки для конденсата</text><path d="M239 451 L226 426" class="guide" /><path d="M481 451 L494 426" class="guide" /><path d="M13 238 L59 238" class="axis" /><text x="17" y="198" class="small" text-anchor="start">Пар</text><path d="M661 238 L704 238" class="axis" /><text x="360" y="575" class="small" text-anchor="middle">Сначала уравновесить; после нагревания — снова</text><rect x="549" y="129" width="15" height="18" rx="1" fill="#dbe5ee" stroke="#263747" stroke-width="2.6"/><rect x="567" y="135" width="12" height="12" rx="1" fill="#dbe5ee" stroke="#263747" stroke-width="2.6"/><text x="568" y="107" class="small" text-anchor="middle">Разновески</text></svg>