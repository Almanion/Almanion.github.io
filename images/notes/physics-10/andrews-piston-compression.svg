<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 651 521" role="img" aria-labelledby="title desc">
<title id="title">Изотермическое сжатие в опыте Эндрюса</title>
<desc id="desc">При движении поршня влево объём уменьшается. На графике A, B и C отвечают V₁, V₂ и V₃. Под графиком четыре положения поршня: газ в A, насыщенный пар в B, жидкость с паром между B и C и жидкость в C. М — манометр.</desc>

