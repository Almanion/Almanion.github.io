<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
<title id="title">Изобары и абсолютный ноль температуры</title><desc id="desc">Прямые зависимости объёма от температуры при двух постоянных давлениях. Их пунктирные продолжения пересекаются на оси температур при минус 273 градусах Цельсия, как в конспекте.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#263747" stroke-width="1.7"/></marker><marker id="route" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#087f80" stroke-width="2.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.heading{font-size:24px;font-weight:600}.small{font-size:21px}.math{font-family:Georgia,'Times New Roman',serif;font-size:27px;font-style:italic}.guide{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.axis{stroke:#263747;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.wall{stroke:#263747;stroke-width:2.5;fill:none;stroke-linejoin:round}</style>
<rect width="640" height="520" rx="12" fill="#fff"/><text x="28" y="36" class="heading">Изобары в шкале Цельсия</text><line x1="48" y1="380" x2="590" y2="380" class="axis"/><line x1="310" y1="380" x2="310" y2="84" class="axis"/><text x="294" y="84" class="math" text-anchor="end">V</text><text x="586" y="425" class="math" text-anchor="end">t, °C</text><text x="317" y="413" class="small">0</text><path d="M85 380 L310 251.75" fill="none" stroke="#176da3" stroke-width="3.5" stroke-dasharray="7 6"/><path d="M310 251.75 L558 110.39000000000004" fill="none" stroke="#176da3" stroke-width="3.5" /><text x="566" y="117.39000000000004" class="math">p</text><path d="M85 380 L310 303.5" fill="none" stroke="#087f80" stroke-width="3.5" stroke-dasharray="7 6"/><path d="M310 303.5 L558 219.17999999999998" fill="none" stroke="#087f80" stroke-width="3.5" /><text x="566" y="226.17999999999998" class="math">p<tspan baseline-shift="sub" font-size="70%" font-style="normal">1</tspan></text><circle cx="85" cy="380" r="4" fill="#263747"/><text x="85" y="416" text-anchor="middle" class="small">−273</text><text x="85" y="463" class="small">Абсолютный ноль</text><text x="85" y="492" class="small">температуры</text>
