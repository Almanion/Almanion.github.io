<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Семейство графиков изобарного процесса</title>
  <desc id="desc">Прямые зависимости объёма от температуры при постоянных давлениях продолжаются до минус 273 градусов Цельсия.</desc>
  <defs>
    <style>
      .frame{fill:#fbfdff;stroke:#d6e1ed;stroke-width:2}.axis{stroke:#173f70;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .line1{stroke:#0b8f87;stroke-width:5}.line2{stroke:#754fa8;stroke-width:5}.extend{stroke:#8298ad;stroke-width:3;stroke-dasharray:9 7}
      .guide{stroke:#d6e1ed;stroke-width:2}.heading{font:700 28px system-ui,sans-serif;fill:#173f70}.label{font:21px system-ui,sans-serif;fill:#173f70}.small{font:17px system-ui,sans-serif;fill:#526b84}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#173f70"/></marker>
  </defs>
  <rect class="frame" x="20" y="20" width="880" height="520" rx="22"/>
  <text class="heading" x="460" y="66" text-anchor="middle">Семейство графиков изобарного процесса</text>
  <path class="axis" d="M130 430H820"/><path class="axis" d="M365 472V112"/>
  <text class="label" x="828" y="448">t, °C</text><text class="label" x="339" y="115">V</text>
  <line class="guide" x1="130" y1="430" x2="130" y2="458"/>
  <text class="small" x="130" y="486" text-anchor="middle">−273 °C</text><text class="small" x="365" y="458" text-anchor="middle">0</text>
  <line class="extend" x1="130" y1="430" x2="365" y2="286"/><line class="line1" x1="365" y1="286" x2="766" y2="112"/>
  <line class="extend" x1="130" y1="430" x2="365" y2="345"/><line class="line2" x1="365" y1="345" x2="766" y2="198"/>
  <text class="label" x="780" y="116">p</text><text class="label" x="780" y="204">p₁</text>
  <circle cx="130" cy="430" r="7" fill="#d4674c"/>
  <text class="small" x="130" y="513" text-anchor="middle">абсолютный ноль температуры, 0 К</text>
</svg>
