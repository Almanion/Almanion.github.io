<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" role="img" aria-labelledby="title desc">
<title id="title">Треугольный цикл одноатомного газа</title><desc id="desc">1=(V0,2p0), 2=(3V0,2p0), 3=(V0,p0). Изобарное расширение 1-2, линейное сжатие 2-3, изохорное нагревание 3-1. Цикл идёт по часовой стрелке.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#263747" stroke-width="1.8"/></marker><marker id="route" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2366a4" stroke-width="2.5"/></marker><pattern id="shade" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#aac5db" stroke-width="1.2"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:27px}.small{font-size:21px}.heading{font-size:26px;font-weight:600}.wall{stroke:#263747;stroke-width:2.6;fill:none;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#263747;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.curve{stroke:#2366a4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#8193a5;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.pipe{stroke:#263747;stroke-width:8;fill:none;stroke-linejoin:round;stroke-linecap:round}.bore{stroke:#fff;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="660" height="500" rx="12" fill="#fff"/><text x="330" y="39" class="heading" text-anchor="middle">Цикл 1 → 2 → 3 → 1</text><path d="M100 390 L625 390" class="axis" /><path d="M100 390 L100 60" class="axis" /><text x="632" y="413" class="math" text-anchor="start">V</text><text x="73" y="66" class="math" text-anchor="start">p</text><path d="M245 100 H535 L245 245 Z" class="" fill="#e5f3fa"/><path d="M245 100 H535 L245 245 Z" class="curve" /><path d="M340 100 L414 100" class="curve" marker-end="url(#route)"/><path d="M435 150 L363 186" class="curve" marker-end="url(#route)"/><path d="M245 214 L245 156" class="curve" marker-end="url(#route)"/><circle cx="245" cy="100" r="4" fill="#263747"/><text x="223" y="88" class="math" text-anchor="start">1</text><circle cx="535" cy="100" r="4" fill="#263747"/><text x="547" y="101" class="math" text-anchor="start">2</text><circle cx="245" cy="245" r="4" fill="#263747"/><text x="222" y="263" class="math" text-anchor="start">3</text><path d="M100 245 L245 245" class="guide" /><text x="88" y="253" class="math" text-anchor="end">p₀</text><path d="M100 100 L245 100" class="guide" /><text x="88" y="108" class="math" text-anchor="end">2p₀</text><path d="M245 390 L245 245" class="guide" /><text x="245" y="427" class="math" text-anchor="middle">V₀</text><path d="M535 390 L535 100" class="guide" /><text x="535" y="427" class="math" text-anchor="middle">3V₀</text><text x="330" y="474" class="small" text-anchor="middle">A′цикл = площадь треугольника = p₀V₀ &gt; 0</text></svg>