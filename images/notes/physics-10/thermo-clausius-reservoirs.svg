<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
<title id="title">Цикл двигателя и вспомогательная машина Карно</title><desc id="desc">Показан пример с тепловым двигателем, совершающим положительную работу газа A1 штрих. Сверху отдельно рассматриваются его цикл и прямой обратимый цикл Карно между двумя резервуарами. Внизу цикл Карно обращён и масштабирован: его теплота Q1 штрих равна минус Q1, поэтому первый резервуар возвращается в исходное состояние. У обратного цикла теплота первого резервуара и работа газа отрицательны, а теплота второго положительна. На стрелках указаны модули теплот и работ; штрих у A обозначает работу газа. Знаки теплот сами по себе не определяют знак работы: положительная работа первого двигателя указана как условие рассматриваемого примера.</desc>
<defs><marker id="flow-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 4.5 L1.5 7.5" fill="none" stroke="#2366a4" stroke-width="1.7"/></marker><marker id="work-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 4.5 L1.5 7.5" fill="none" stroke="#263747" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.heading{font-size:27px;font-weight:600}.subheading{font-size:24px;font-weight:600}.small{font-size:23px}.device{font-size:23px}.math{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-style:italic}.flow{fill:none;stroke:#2366a4;stroke-width:2.4;stroke-linecap:round;marker-end:url(#flow-arrow)}.work{fill:none;stroke:#263747;stroke-width:2.2;stroke-linecap:round;marker-end:url(#work-arrow)}.dash{fill:none;stroke:#8193a5;stroke-width:1.3;stroke-dasharray:6 6}.path{fill:none;stroke:#2366a4;stroke-width:2.8;stroke-linecap:round}.actual{stroke-dasharray:8 7}.guide{fill:none;stroke:#8193a5;stroke-width:1.3}</style>
<rect width="900" height="1100" rx="12" fill="#fff"/>
<text x="450" y="50" class="subheading" text-anchor="middle">1. Циклы по отдельности</text>
<text x="235" y="112" class="" text-anchor="middle">Произвольный двигатель</text>
<text x="665" y="112" class="" text-anchor="middle">Прямой цикл Карно</text>
<path d="M450 139 V468" class="dash" />
<rect x="90" y="145" width="290" height="52" rx="8" fill="#fcf0e8" stroke="#263747" stroke-width="2"/><text x="235.0" y="179" class="small" text-anchor="middle">Резервуар T₁</text>
<rect x="90" y="375" width="290" height="52" rx="8" fill="#e8f3fa" stroke="#263747" stroke-width="2"/><text x="235.0" y="409" class="small" text-anchor="middle">Резервуар T₂</text>
<ellipse cx="235" cy="285" rx="88" ry="54" fill="#fff" stroke="#263747" stroke-width="2.4"/><text x="235" y="279" class="device" text-anchor="middle">Цикл</text><text x="235" y="306" class="device" text-anchor="middle">двигателя</text>
<path d="M235 197 V231" class="flow" />
<path d="M235 339 V375" class="flow" />
<rect x="520" y="145" width="290" height="52" rx="8" fill="#fcf0e8" stroke="#263747" stroke-width="2"/><text x="665.0" y="179" class="small" text-anchor="middle">Резервуар T₁</text>
<rect x="520" y="375" width="290" height="52" rx="8" fill="#e8f3fa" stroke="#263747" stroke-width="2"/><text x="665.0" y="409" class="small" text-anchor="middle">Резервуар T₂</text>
<ellipse cx="665" cy="285" rx="88" ry="54" fill="#fff" stroke="#263747" stroke-width="2.4"/><text x="665" y="279" class="device" text-anchor="middle">Обратимый</text><text x="665" y="306" class="device" text-anchor="middle">цикл Карно</text>
<path d="M665 197 V231" class="flow" />
<path d="M665 339 V375" class="flow" />
<text x="272" y="221" class="math" text-anchor="start">|Q₁|</text>
<text x="272" y="367" class="math" text-anchor="start">|Q₂|</text>
<text x="702" y="221" class="math" text-anchor="start">|Q₁′|</text>
<text x="702" y="367" class="math" text-anchor="start">|Q₂′|</text>
<path d="M147 285 H60" class="work" />
<text x="104" y="266" class="math" text-anchor="middle">|A′₁|</text>
<path d="M753 285 H840" class="work" />
<text x="797" y="266" class="math" text-anchor="middle">|A′₂|</text>
<text x="235" y="460" class="small" text-anchor="middle">Q₁ &gt; 0, Q₂ &lt; 0, A′₁ &gt; 0</text>
<text x="665" y="460" class="small" text-anchor="middle">Q₁′ &gt; 0, Q₂′ &lt; 0, A′₂ &gt; 0</text>
<path d="M60 493 H840" class="dash" />
<text x="450" y="536" class="subheading" text-anchor="middle">2. Обращаем и объединяем циклы</text>
<rect x="60" y="572" width="780" height="52" rx="8" fill="#fcf0e8" stroke="#263747" stroke-width="2"/><text x="450.0" y="606" class="small" text-anchor="middle">Резервуар T₁</text>
<rect x="60" y="884" width="780" height="52" rx="8" fill="#e8f3fa" stroke="#263747" stroke-width="2"/><text x="450.0" y="918" class="small" text-anchor="middle">Резервуар T₂</text>
<ellipse cx="235" cy="750" rx="88" ry="54" fill="#fff" stroke="#263747" stroke-width="2.4"/><text x="235" y="744" class="device" text-anchor="middle">Цикл</text><text x="235" y="771" class="device" text-anchor="middle">двигателя</text>
<ellipse cx="665" cy="750" rx="88" ry="54" fill="#fff" stroke="#263747" stroke-width="2.4"/><text x="665" y="744" class="device" text-anchor="middle">Обратный</text><text x="665" y="771" class="device" text-anchor="middle">цикл Карно</text>
<path d="M235 624 V696" class="flow" />
<text x="272" y="669" class="math" text-anchor="start">|Q₁|</text>
<path d="M235 804 V884" class="flow" />
<text x="272" y="852" class="math" text-anchor="start">|Q₂|</text>
<path d="M665 696 V624" class="flow" />
<text x="702" y="669" class="math" text-anchor="start">|Q₁′|</text>
<path d="M665 884 V804" class="flow" />
<text x="702" y="852" class="math" text-anchor="start">|Q₂′|</text>
<path d="M147 750 H60" class="work" />
<text x="104" y="731" class="math" text-anchor="middle">|A′₁|</text>
<path d="M840 750 H753" class="work" />
<text x="797" y="731" class="math" text-anchor="middle">|A′₂|</text>
<text x="450" y="981" class="math" text-anchor="middle">Q₁′ = −Q₁;  Q₁ + Q₁′ = 0</text>
<text x="450" y="1023" class="small" text-anchor="middle">В обратном цикле: Q₁′ &lt; 0,  Q₂′ &gt; 0,  A′₂ &lt; 0.</text>
<text x="450" y="1065" class="small" text-anchor="middle">На стрелках — модули теплот и работ.</text>
</svg>
