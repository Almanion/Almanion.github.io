<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 565" role="img" aria-labelledby="title desc">
<title id="title">Диаграмма p(V) с расчётными изотермами и площадками равновесия</title>
<desc id="desc">На трёх докритических изотермах показаны отрезки ac, a′c′ и a″c″. Точки a и c отвечают Vж и Vг при давлении насыщенного пара, b лежит на площадке, d и e — экстремумы расчётной кривой. Границы сходятся в критической точке K.</desc>

