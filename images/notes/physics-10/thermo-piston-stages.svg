<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 845" role="img" aria-labelledby="title desc">
<title id="title">Поршень на упорах: изохора и изобара</title><desc id="desc">Первоначально поршень лежит на упорах на высоте h. Газ нагревают при V=Sh до давления p*=p0+Mg/S. Затем поршень медленно поднимается до H при постоянном p*. На p-V диаграмме вертикальный участок 1-2, затем горизонтальный 2-3.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#263747" stroke-width="1.8"/></marker><marker id="route" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2366a4" stroke-width="2.5"/></marker><pattern id="shade" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#aac5db" stroke-width="1.2"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:27px}.small{font-size:21px}.heading{font-size:26px;font-weight:600}.wall{stroke:#263747;stroke-width:2.6;fill:none;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#263747;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.curve{stroke:#2366a4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#8193a5;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.pipe{stroke:#263747;stroke-width:8;fill:none;stroke-linejoin:round;stroke-linecap:round}.bore{stroke:#fff;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="710" height="845" rx="12" fill="#fff"/><text x="350" y="39" class="heading" text-anchor="middle">Два этапа нагревания</text><rect x="95" y="316" width="165" height="104" rx="0" fill="#e5f3fa" stroke="none" stroke-width="2.6"/><path d="M95 101 V420 H260 V101" class="wall" /><rect x="95" y="292" width="165" height="24" rx="0" fill="#b7c7d6" stroke="#263747" stroke-width="2.6"/><rect x="95" y="316" width="22" height="10" rx="0" fill="#263747" stroke="none" stroke-width="2.6"/><rect x="238" y="316" width="22" height="10" rx="0" fill="#263747" stroke="none" stroke-width="2.6"/><rect x="419" y="185" width="165" height="235" rx="0" fill="#e5f3fa" stroke="none" stroke-width="2.6"/><path d="M419 101 V420 H584 V101" class="wall" /><rect x="419" y="161" width="165" height="24" rx="0" fill="#b7c7d6" stroke="#263747" stroke-width="2.6"/><rect x="419" y="316" width="22" height="10" rx="0" fill="#263747" stroke="none" stroke-width="2.6"/><rect x="562" y="316" width="22" height="10" rx="0" fill="#263747" stroke="none" stroke-width="2.6"/><text x="178" y="82" class="small" text-anchor="middle">До подъёма</text><text x="502" y="82" class="small" text-anchor="middle">После подъёма</text><text x="178" y="363" class="math" text-anchor="middle">p₀</text><text x="502" y="335" class="math" text-anchor="middle">p*</text><path d="M58 316 L58 420" class="wall" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="39" y="375" class="math" text-anchor="middle">h</text><path d="M626 185 L626 420" class="wall" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="647" y="310" class="math" text-anchor="start">H</text><path d="M502 220 L502 186" class="curve" marker-end="url(#route)"/><text x="534" y="230" class="small" text-anchor="start">p*S</text><path d="M502 112 L502 158" class="axis" /><text x="502" y="104" class="small" text-anchor="middle">p₀S + Mg</text><text x="178" y="454" class="small" text-anchor="middle">Упоры</text><path d="M165 434 L115 325" class="guide" /><path d="M87 738 L660 738" class="axis" /><path d="M87 738 L87 490" class="axis" /><text x="670" y="751" class="math" text-anchor="start">V</text><text x="59" y="497" class="math" text-anchor="start">p</text><path d="M225 688 L225 548" class="curve" /><path d="M225 548 L400 548" class="curve" /><path d="M225 648 L225 590" class="curve" marker-end="url(#route)"/><path d="M290 548 L350 548" class="curve" marker-end="url(#route)"/><circle cx="225" cy="688" r="4" fill="#263747"/><text x="235" y="678" class="math" text-anchor="start">1</text><circle cx="225" cy="548" r="4" fill="#263747"/><text x="235" y="538" class="math" text-anchor="start">2</text><circle cx="400" cy="548" r="4" fill="#263747"/><text x="410" y="538" class="math" text-anchor="start">3</text><path d="M87 688 L225 688" class="guide" /><text x="73" y="696" class="math" text-anchor="end">p₀</text><path d="M87 548 L225 548" class="guide" /><text x="73" y="556" class="math" text-anchor="end">p*</text><path d="M225 738 L225 688" class="guide" /><text x="225" y="777" class="math" text-anchor="middle">V₀ = Sh</text><path d="M400 738 L400 548" class="guide" /><text x="400" y="777" class="math" text-anchor="middle">SH</text><text x="350" y="817" class="small" text-anchor="middle">1 → 2: V = const; 2 → 3: p = p*</text></svg>