<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" role="img" aria-labelledby="title desc">
  <title id="title">Графики изохорного процесса</title>
  <desc id="desc">Изохорный процесс показан в координатах p от V, p от T и V от T, а также семейством прямых p от T.</desc>
  <defs>
    <style>
      .frame,.panel{fill:#fbfdff;stroke:#d6e1ed;stroke-width:2}.axis{stroke:#173f70;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .line1{stroke:#0b8f87;stroke-width:4;fill:none}.line2{stroke:#4f78a2;stroke-width:4;fill:none}.line3{stroke:#754fa8;stroke-width:4;fill:none}
      .extend{stroke:#8298ad;stroke-width:2;stroke-dasharray:7 7}.point{fill:#d4674c}.heading{font:700 27px system-ui,sans-serif;fill:#173f70}.label{font:19px system-ui,sans-serif;fill:#173f70}.small{font:16px system-ui,sans-serif;fill:#526b84}.formula{font:21px system-ui,sans-serif;fill:#173f70}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#173f70"/></marker>
  </defs>
  <rect class="frame" x="20" y="20" width="1040" height="740" rx="22"/>
  <text class="heading" x="540" y="62" text-anchor="middle">Графики изохорного процесса</text>
  <text class="formula" x="540" y="99" text-anchor="middle">p / T = const  V = const</text>
  <g transform="translate(55 125)"><rect class="panel" width="300" height="250" rx="16"/><path class="axis" d="M55 205H264"/><path class="axis" d="M55 205V42"/><text class="label" x="270" y="222">V</text><text class="label" x="36" y="46">p</text><line class="line1" x1="160" y1="68" x2="160" y2="181"/><circle class="point" cx="160" cy="160" r="6"/><circle class="point" cx="160" cy="92" r="6"/><text class="small" x="171" y="166">1</text><text class="small" x="171" y="98">2</text><text class="small" x="150" y="238" text-anchor="middle">p(V)</text></g>
  <g transform="translate(390 125)"><rect class="panel" width="300" height="250" rx="16"/><path class="axis" d="M55 205H264"/><path class="axis" d="M55 205V42"/><text class="label" x="270" y="222">T</text><text class="label" x="36" y="46">p</text><line class="extend" x1="55" y1="205" x2="98" y2="171"/><line class="line2" x1="98" y1="171" x2="236" y2="65"/><circle class="point" cx="130" cy="146" r="6"/><circle class="point" cx="210" cy="85" r="6"/><text class="small" x="113" y="142">1</text><text class="small" x="219" y="82">2</text><text class="small" x="150" y="238" text-anchor="middle">p(T)</text></g>
  <g transform="translate(725 125)"><rect class="panel" width="300" height="250" rx="16"/><path class="axis" d="M55 205H264"/><path class="axis" d="M55 205V42"/><text class="label" x="270" y="222">T</text><text class="label" x="36" y="46">V</text><line class="line3" x1="92" y1="128" x2="236" y2="128"/><circle class="point" cx="122" cy="128" r="6"/><circle class="point" cx="210" cy="128" r="6"/><text class="small" x="116" y="116">1</text><text class="small" x="204" y="116">2</text><text class="small" x="150" y="238" text-anchor="middle">V(T)</text></g>
  <g transform="translate(165 420)"><rect class="panel" width="750" height="285" rx="16"/><text class="label" x="375" y="34" text-anchor="middle">Семейство графиков изохорного процесса</text><path class="axis" d="M75 235H685"/><path class="axis" d="M75 235V57"/><text class="label" x="693" y="252">T</text><text class="label" x="55" y="61">p</text><path class="line3" d="M75 235L355 65"/><path class="line2" d="M75 235L515 88"/><path class="line1" d="M75 235L655 143"/><text class="small" x="375" y="270" text-anchor="middle">V₁ &lt; V₂ &lt; V₃</text></g>
</svg>
