<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Совместная работа двигателя и обратной машины Карно</title><desc id="desc">Предполагаемый двигатель с КПД выше предела Карно приводит обратную машину Карно. Выбирают одинаковые по модулю теплоты холодильника. После сокращения этих теплообменов оставалась бы работа за счёт одного нагревателя, что противоречит второму началу.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 4.5 L1.5 7.5" fill="none" stroke="#263747" stroke-width="1.7"/></marker><marker id="route" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#2366a4" stroke-width="1.8"/></marker><marker id="warm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#b54b38" stroke-width="1.8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}.small{font-size:21px}.heading{font-size:27px;font-weight:600}.wall{stroke:#263747;stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#263747;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.flow{stroke:#2366a4;stroke-width:2.4;fill:none;marker-end:url(#route)}.work{stroke:#263747;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.guide{stroke:#8193a5;stroke-width:1.3;stroke-dasharray:6 6;fill:none}.leader{stroke:#8193a5;stroke-width:1.3;fill:none}</style>
<rect width="1000" height="660" rx="12" fill="#fff"/>
<text x="500" y="40" class="heading" text-anchor="middle" >К доказательству второй теоремы Карно</text>
<rect x="70" y="80" width="860" height="62" rx="8" fill="#fcf0e8" stroke="#263747" stroke-width="2"/>
<text x="500" y="120" class="" text-anchor="middle" >Нагреватель, T₁</text>
<rect x="70" y="475" width="860" height="62" rx="8" fill="#e8f3fa" stroke="#263747" stroke-width="2"/>
<text x="500" y="515" class="" text-anchor="middle" >Холодильник, T₂</text>
<circle cx="260" cy="305" r="72" fill="#fff" stroke="#263747" stroke-width="2.3"/>
<text x="260" y="299" class="" text-anchor="middle" >Двигатель</text>
<text x="260" y="332" class="small" text-anchor="middle" >η′ &gt; ηmax</text>
<circle cx="740" cy="305" r="72" fill="#fff" stroke="#263747" stroke-width="2.3"/>
<text x="740" y="299" class="" text-anchor="middle" >Обратный</text>
<text x="740" y="332" class="small" text-anchor="middle" >цикл Карно</text>
<path d="M260 142 V233" class="flow" />
<text x="287" y="198" class="math" text-anchor="start" >|Q₁′|</text>
<path d="M260 377 V475" class="flow" />
<text x="287" y="431" class="math" text-anchor="start" >|Q₂′|</text>
<path d="M740 233 V142" class="flow" />
<text x="767" y="198" class="math" text-anchor="start" >|Q₁|</text>
<path d="M740 475 V377" class="flow" />
<text x="767" y="431" class="math" text-anchor="start" >|Q₂|</text>
<path d="M332 305 H488" class="work" />
<text x="405" y="286" class="math" text-anchor="middle" >A′</text>
<path d="M500 305 H668" class="work" />
<text x="587" y="286" class="math" text-anchor="middle" >A</text>
<path d="M500 305 V420" class="work" />
<text x="515" y="408" class="math" text-anchor="start" >A′ − A &gt; 0</text>
<circle cx="500" cy="305" r="3" fill="#263747" stroke="#263747" stroke-width="2.3"/>
<text x="500" y="585" class="small" text-anchor="middle" >|Q₂′| = |Q₂|: теплообмен с холодильником сокращается.</text>
<text x="500" y="625" class="small" text-anchor="middle" >Осталась бы работа за счёт теплоты одного нагревателя.</text>
</svg>
