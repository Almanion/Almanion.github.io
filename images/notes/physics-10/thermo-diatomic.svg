<title id="title">Двухатомная молекула: оси и повороты</title><desc id="desc">Ось y проходит вдоль связи. Голубые круговые стрелки охватывают оси x и z и обозначают вращения вокруг них. Три поступательные и две вращательные степени свободы.</desc>
