<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 285" role="img" aria-labelledby="title desc">
<title id="title">Двухатомная молекула: оси и повороты</title><desc id="desc">Связь направлена вдоль y. Показаны две вращательные степени свободы вокруг x и z; вращение вокруг линии связи в принятой модели не учитывается.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#263747" stroke-width="1.8"/></marker><marker id="route" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2366a4" stroke-width="2.5"/></marker><pattern id="shade" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#aac5db" stroke-width="1.2"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:27px}.small{font-size:21px}.heading{font-size:26px;font-weight:600}.wall{stroke:#263747;stroke-width:2.6;fill:none;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#263747;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.curve{stroke:#2366a4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#8193a5;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.pipe{stroke:#263747;stroke-width:8;fill:none;stroke-linejoin:round;stroke-linecap:round}.bore{stroke:#fff;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="540" height="285" rx="12" fill="#fff"/><path d="M80 160 L470 160" class="axis" /><path d="M270 250 L270 35" class="axis" /><path d="M350 220 L175 85" class="axis" /><path d="M270 95 L270 225" class="wall" style="stroke:#2366a4;stroke-width:5"/><circle cx="270" cy="95" r="16" fill="#2366a4"/><circle cx="270" cy="225" r="16" fill="#2366a4"/><circle cx="270" cy="160" r="3" fill="#263747"/><text x="480" y="170" class="math" text-anchor="start">x</text><text x="283" y="41" class="math" text-anchor="start">y</text><text x="151" y="82" class="math" text-anchor="start">z</text><path d="M391 137 C422 131 422 186 391 181" class="curve" marker-end="url(#route)"/><text x="434" y="212" class="math" text-anchor="start">φₓ</text><path d="M177 119 C150 113 141 148 158 162" class="curve" marker-end="url(#route)"/><text x="103" y="189" class="math">φ<tspan baseline-shift="sub" font-size="19">z</tspan></text></svg>