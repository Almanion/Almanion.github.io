<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Треугольный газовый цикл с точками 4 и 5</title><desc id="desc">Цикл 1–2–3–1: 1=(V0,p0), 2=(V0,2p0), 3=(2V0,p0). На прямой 2–3 точка 5=(3V0/2,3p0/2) соответствует максимуму температуры, а следующая точка 4=(15V0/8,9p0/8) — смене знака элементарной теплоты. В порядке движения 2,5,4,3. Положение всех точек вычислено по одной шкале. Зелёный пунктир — касательная изотерма, оранжевый — касательная адиабата для одноатомного газа с показателем 5/3. При обходе по часовой стрелке работа газа положительна.</desc>
