<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 705" role="img" aria-labelledby="title desc">
<title id="title">Опыт Штерна: прямолинейный пролёт и смещение следа</title><desc id="desc">Вид сверху в момент попадания частицы. S0 — положение щели при вылете, S1 — положение щели после поворота цилиндров. Частица летит прямо из S0 в B. Точка A, отмеченная при неподвижном приборе, поворачивается вместе с внешним цилиндром. Угол от A до B и дуга s направлены против вращения. Показаны радиусы r и R, скорость v, угловая скорость омега и угол дельта фи.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#263747" stroke-width="1.7"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263747}.label{font-size:24px}.small{font-size:22px}.heading{font-size:26px;font-weight:600}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}.number{font-size:21px}.wall{fill:none;stroke:#263747;stroke-width:2.3;stroke-linejoin:round}.leader{fill:none;stroke:#8291a2;stroke-width:1.3}.guide{fill:none;stroke:#8291a2;stroke-width:1.3;stroke-dasharray:6 6}.axis{fill:none;stroke:#263747;stroke-width:1.7;marker-end:url(#arrow)}.beam{fill:none;stroke:#087f80;stroke-width:2.5;stroke-dasharray:7 5}.rotation{fill:none;stroke:#263747;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="720" height="705" rx="12" fill="#fff"/>
<defs>
  <marker id="stern-arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f80"/></marker>
  <marker id="stern-arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8455a5"/></marker>
 </defs><style>
 .stern-wall{fill:none;stroke:#263747;stroke-width:3;stroke-linejoin:round}.stern-glass{fill:#edf7fc;fill-opacity:.6;stroke:#7fa8bf;stroke-width:3}
 .stern-leader{fill:none;stroke:#8291a2;stroke-width:1.5;stroke-linejoin:round}.stern-point{fill:#8291a2}
 .stern-beam{fill:none;stroke:#087f80;stroke-width:3;marker-end:url(#stern-arrow-teal)}
 .stern-dimension{fill:none;stroke:#8455a5;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
 .stern-turn{fill:none;stroke:#176da3;stroke-width:3;marker-end:url(#arrow)}.stern-guide{fill:none;stroke:#8291a2;stroke-width:1.5;stroke-dasharray:6 6}
 .stern-caption{font-size:22px;fill:#526a7e}.stern-teal{fill:#087f80}.stern-purple{fill:#8455a5}.stern-blue{fill:#176da3}
 </style><text x="28.000" y="42.000" class="heading" >Определение скорости · вид сверху</text><text x="28.000" y="78.000" class="stern-caption" >В момент попадания частицы на стенку</text><circle cx="320.000" cy="340.000" r="200" fill="#fbfdff" stroke="#263747" stroke-width="3" id="stern-top-outer-cylinder"/><path d="M398.778 308.077 A85 85 0 1 1 393.975 298.135" class="stern-wall" id="stern-top-inner-cylinder"/><line x1="320.000" y1="340.000" x2="500.089" y2="253.007" class="stern-guide" id="stern-top-reference-ray"/><line x1="320.000" y1="340.000" x2="520.000" y2="340.000" class="stern-guide" id="stern-top-flight-ray"/><line x1="405.000" y1="326.000" x2="405.000" y2="354.000" class="stern-guide" style="stroke-width:4;stroke-dasharray:4 4" id="stern-top-initial-slit"/><circle cx="396.538" cy="303.028" r="2" fill="#176da3" id="stern-top-current-slit"/><text x="391.538" y="282.028" class="math stern-blue" text-anchor="middle">S<tspan baseline-shift="sub" font-size="70%" font-style="normal">1</tspan></text><text x="411.000" y="396.000" class="math" style="fill:#687e90">S<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan></text><circle cx="320.000" cy="340.000" r="5" fill="#b85032" id="stern-top-source"/><text x="296.000" y="369.000" class="math" >O</text><line x1="417.000" y1="340.000" x2="508.000" y2="340.000" class="stern-beam" id="stern-top-free-flight"/><text x="459.000" y="371.000" class="math stern-teal" >v</text><circle cx="500.089" cy="253.007" r="7" fill="#fff" stroke="#176da3" stroke-width="3" id="stern-top-reference-mark"/><text x="515.089" y="240.007" class="math stern-blue" >A</text><path d="M519.878 333.001 A200 200 0 0 1 519.878 346.999" class="stern-wall" style="stroke:#b85032;stroke-width:9" id="stern-top-trace"/><circle cx="520.000" cy="340.000" r="5" fill="#b85032" id="stern-top-impact"/><text x="551.000" y="358.000" class="math" style="fill:#b85032">B</text><path d="M425.352 289.109 A117 117 0 0 1 437.000 340.000" class="stern-wall" style="stroke:#8455a5;stroke-width:2" marker-end="url(#stern-arrow-purple)" id="stern-top-angle"/><text x="457.000" y="289.000" class="math stern-purple" >Δφ</text><path d="M520.800 243.003 A223 223 0 0 1 543.000 340.000" class="stern-dimension" id="stern-top-shift"/><text x="572.000" y="291.000" class="math stern-purple" >s</text><line x1="320.000" y1="340.000" x2="235.000" y2="340.000" class="stern-dimension" id="stern-top-radius-r"/><text x="277.500" y="324.000" class="math stern-purple" text-anchor="middle">r</text><line x1="320.000" y1="340.000" x2="320.000" y2="540.000" class="stern-dimension" id="stern-top-radius-R"/><text x="294.000" y="462.000" class="math stern-purple" >R</text><path d="M142.847 486.686 A230 230 0 0 0 444.270 533.538" class="stern-turn" id="stern-top-rotation"/><text x="357.000" y="612.000" class="math stern-blue" >ω</text><text x="360.000" y="665.000" class="stern-caption" text-anchor="middle">След смещается против вращения</text>
</svg>
