<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 710" role="img" aria-labelledby="title desc">
<title id="title">Мономолекулярная плёнка</title><desc id="desc">На воде масляная плёнка отодвигает тальк; её площадь S измеряют по границе. Ниже показан увеличенный разрез одного слоя одинаковых молекул. Толщина слоя d равна отношению известного объёма масла V к площади S.</desc>
