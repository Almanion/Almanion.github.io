<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Опыт Бойля и Мариотта</title>
  <desc id="desc">Два состояния газа в закрытом колене U-образной трубки до и после добавления столба ртути высотой h.</desc>
  <defs>
    <style>
      .frame{fill:#fbfdff;stroke:#d6e1ed;stroke-width:2}.glass{fill:none;stroke:#173f70;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .mercury{fill:none;stroke:#8298ad;stroke-width:24;stroke-linecap:butt;stroke-linejoin:round}.gas{fill:#dce8f4;stroke:#4f78a2;stroke-width:2}
      .heading{font:700 28px system-ui,sans-serif;fill:#173f70}.label{font:21px system-ui,sans-serif;fill:#173f70}.small{font:17px system-ui,sans-serif;fill:#526b84}
      .measure{stroke:#d4674c;stroke-width:3;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#d4674c;stroke-width:2;stroke-dasharray:7 6}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d4674c"/></marker>
  </defs>
  <rect class="frame" x="20" y="20" width="920" height="520" rx="22"/>
  <text class="heading" x="480" y="65" text-anchor="middle">Опыт Бойля и Мариотта (1662)</text>

  <g aria-label="Первое состояние">
    <text class="label" x="245" y="112" text-anchor="middle">I</text>
    <path class="glass" d="M154 142V356Q154 440 245 440Q336 440 336 356V142"/>
    <path class="mercury" d="M176 306V356Q176 416 245 416Q314 416 314 356V306"/>
    <rect class="gas" x="177" y="157" width="44" height="149" rx="18"/>
    <line x1="177" y1="306" x2="221" y2="306" stroke="#526b84" stroke-width="3"/>
    <line x1="314" y1="306" x2="336" y2="306" stroke="#526b84" stroke-width="3"/>
    <text class="small" x="199" y="231" text-anchor="middle">p₀</text>
    <text class="small" x="199" y="255" text-anchor="middle">V₀</text>
    <text class="small" x="245" y="482" text-anchor="middle">p₀ = 1 атм</text>
  </g>

  <g aria-label="Второе состояние">
    <text class="label" x="686" y="112" text-anchor="middle">II</text>
    <path class="glass" d="M595 142V356Q595 440 686 440Q777 440 777 356V142"/>
    <path class="mercury" d="M617 267V356Q617 416 686 416Q755 416 755 356V185"/>
    <rect class="gas" x="618" y="157" width="44" height="110" rx="18"/>
    <line x1="618" y1="267" x2="662" y2="267" stroke="#526b84" stroke-width="3"/>
    <line x1="755" y1="185" x2="777" y2="185" stroke="#526b84" stroke-width="3"/>
    <text class="small" x="640" y="209" text-anchor="middle">p</text>
    <text class="small" x="640" y="233" text-anchor="middle">V</text>
    <line class="guide" x1="790" y1="185" x2="824" y2="185"/>
    <line class="guide" x1="675" y1="267" x2="824" y2="267"/>
    <line class="measure" x1="812" y1="193" x2="812" y2="259"/>
    <text class="label" x="835" y="233">h</text>
    <text class="small" x="686" y="482" text-anchor="middle">после добавления ртути</text>
  </g>
</svg>
