<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 855" role="img" aria-labelledby="title desc">
<title id="title">Опыт Бойля и Мариотта</title><desc id="desc">В коротком запаянном колене заключён газ. Сначала поверхности ртути находятся на одной высоте. Добавленная в открытое колено ртуть сжимает газ; h обозначает разность высот поверхностей ртути.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#263747" stroke-width="1.7"/></marker><marker id="route" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#087f80" stroke-width="2.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#263747}.heading{font-size:24px;font-weight:600}.small{font-size:21px}.math{font-family:Georgia,'Times New Roman',serif;font-size:27px;font-style:italic}.guide{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 6;fill:none}.axis{stroke:#263747;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.wall{stroke:#263747;stroke-width:2.5;fill:none;stroke-linejoin:round}</style>
<rect width="720" height="855" rx="12" fill="#fff"/><g transform="translate(0 0)"><text x="28" y="34" class="heading">I. Начальное состояние</text><path d="M228 110 Q240 98 252 110 V225 H228 Z" fill="#d9eff9"/><path d="M228 225 H252 V270 A58 58 0 0 0 368 270 V225 H392 V270 A82 82 0 0 1 228 270 Z" fill="#7d8d9f"/><path d="M392 70 V270 A82 82 0 0 1 228 270 V110 Q240 98 252 110 V270 A58 58 0 0 0 368 270 V70" class="wall"/><line x1="228" y1="225" x2="252" y2="225" stroke="#263747" stroke-width="2"/><line x1="368" y1="225" x2="392" y2="225" stroke="#263747" stroke-width="2"/><text x="42" y="133" >Газ</text><text x="42" y="166" class="math">p<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan>, V<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan></text><line x1="110" y1="141" x2="221" y2="141" stroke="#64748b" stroke-width="1.5"/><text x="408" y="80" class="small">Открыто</text><text x="310" y="395" text-anchor="middle">Ртуть</text><line x1="258" y1="225" x2="361" y2="225" class="guide"/><text x="444" y="222" class="small">Уровни ртути</text><text x="444" y="250" class="small">одинаковы</text></g><line x1="28" y1="420" x2="692" y2="420" stroke="#e2e8f0"/><g transform="translate(0 435)"><text x="28" y="34" class="heading">II. После добавления ртути</text><path d="M228 110 Q240 98 252 110 V170 H228 Z" fill="#d9eff9"/><path d="M228 170 H252 V270 A58 58 0 0 0 368 270 V120 H392 V270 A82 82 0 0 1 228 270 Z" fill="#7d8d9f"/><path d="M392 70 V270 A82 82 0 0 1 228 270 V110 Q240 98 252 110 V270 A58 58 0 0 0 368 270 V70" class="wall"/><line x1="228" y1="170" x2="252" y2="170" stroke="#263747" stroke-width="2"/><line x1="368" y1="120" x2="392" y2="120" stroke="#263747" stroke-width="2"/><text x="42" y="133" >Газ</text><text x="42" y="166" class="math">p, V</text><line x1="110" y1="141" x2="221" y2="141" stroke="#64748b" stroke-width="1.5"/><text x="408" y="80" class="small">Открыто</text><text x="310" y="395" text-anchor="middle">Ртуть</text><line x1="398" y1="120" x2="474" y2="120" class="guide"/><line x1="256" y1="170" x2="474" y2="170" class="guide"/><line x1="464" y1="120" x2="464" y2="170" stroke="#263747" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="482" y="153" class="math">h</text><text x="470" y="269" class="math">V &lt; V<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan></text><text x="470" y="308" class="math">p &gt; p<tspan baseline-shift="sub" font-size="70%" font-style="normal">0</tspan></text></g>
</svg>
